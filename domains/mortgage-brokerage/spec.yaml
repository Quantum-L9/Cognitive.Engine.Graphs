# --- L9_META ---
# l9_schema: 1
# origin: domain-specific
# engine: graph
# layer: [config]
# tags: [domains, mortgage]
# owner: domain-team
# status: active
# --- /L9_META ---
#
---
domain:
  id: mortgage-brokerage
  name: MortgageOS Borrower-Lender-Product Matching
  description: >
    Match borrower profiles to optimal wholesale lender loan products with
    ECOA-compliant scoring and outcome feedback loops.
  version: 1.1.0
  alternatedomains: []
  # Dormant until state licensing and the borrower's lender blacklist can be
  # enforced (CEG-COR-012, decision DEC-15 "D now, then A"). Both constrain the
  # LoanProduct's Lender — Lender-[:OPERATESIN]->State with statecode =
  # $propertystate, and BorrowerProfile-[:BLACKLISTEDLENDER]->Lender — and no
  # existing gate can constrain a non-candidate alias or a query-anchored edge.
  # Serving without them would rank products from lenders unlicensed in the
  # borrower's state. The pack compiles cleanly; only this declaration withholds
  # it. DORMANT_DOMAIN_PACKS_ENABLED=true serves it WITHOUT licensing and
  # blacklist enforcement.
  activation: dormant

ontology:
  nodes:
    - label: BorrowerProfile
      managedby: sync
      queryentity: true
      properties:
        - {name: borrowerid, type: string, required: true}
        - {name: creditscore, type: int, required: true}
        - {name: annualincomeusd, type: float, unit: currency, required: true}
        - {name: monthlydebtusd, type: float, unit: currency, required: true}
        - {name: loanamountusd, type: float, unit: currency, required: true}
        - {name: propertyvalueusd, type: float, unit: currency, required: true}
        - {name: downpaymentusd, type: float, unit: currency, required: true}
        - {name: propertytype, type: enum, values: [singlefamily, condo, townhouse, multifamily]}
        - {name: propertystate, type: string, required: true}
        - {name: occupancy, type: enum, values: [owneroccupied, secondhome, investment]}
        - {name: loanpurpose, type: enum, values: [purchase, refinance, cashout, heloc]}
        - {name: vaeligible, type: bool}
        - {name: firsttimebuyer, type: bool}
        - {name: dtipct, type: float, unit: percentage, managedby: computed}
        - {name: ltvpct, type: float, unit: percentage, managedby: computed}

    - label: LoanProduct
      managedby: sync
      candidate: true
      properties:
        - {name: productid, type: string, required: true}
        - {name: productname, type: string}
        - {name: lenderid, type: string, required: true}
        - {name: loancategory, type: enum, values: [conventional, fha, va, jumbo]}
        - {name: loanpurpose, type: enum, values: [purchase, refinance, cashout]}
        - {name: mincreditscore, type: int}
        - {name: maxdtipct, type: float, unit: percentage}
        - {name: maxltvpct, type: float, unit: percentage}
        - {name: minloanamountusd, type: float, unit: currency}
        - {name: maxloanamountusd, type: float, unit: currency}
        - {name: requiresvaeligibility, type: bool}
        - {name: baseratepct, type: float, unit: percentage}
        - {name: avgclosingdays, type: int}
        - {name: louvaincommunityid, type: int, managedby: gds}

    - label: Lender
      managedby: sync
      auxiliary: true
      properties:
        - {name: lenderid, type: string, required: true}
        - {name: name, type: string}
        - {name: nmlsid, type: string}
        - {name: approvalratepct, type: float, unit: percentage, managedby: gds}

    - label: State
      managedby: static
      taxonomy: true
      properties:
        - {name: statecode, type: string, required: true}
        - {name: conforminglimitusd, type: float, unit: currency}

  edges:
    - {type: OFFEREDBY, from: LoanProduct, to: Lender, direction: DIRECTED, category: capability, managedby: sync}
    - {type: OPERATESIN, from: Lender, to: State, direction: DIRECTED, category: capability, managedby: sync}
    - {type: BLACKLISTEDLENDER, from: BorrowerProfile, to: Lender, direction: DIRECTED, category: exclusion, managedby: sync}
    - {type: APPLICATION, from: BorrowerProfile, to: LoanProduct, direction: DIRECTED, category: transaction, managedby: sync}
    - {type: PRODUCTSIMILARITY, from: LoanProduct, to: LoanProduct, direction: UNDIRECTED, category: precomputed, managedby: gds}

matchentities:
  candidate:
    - {label: LoanProduct, matchdirection: borrowertoproduct}
  queryentity:
    - {label: BorrowerProfile, matchdirection: borrowertoproduct}

queryschema:
  matchdirections: [borrowertoproduct]
  fields:
    - {name: borrowerid, type: string, required: true}
    - {name: creditscore, type: int, required: true}
    - {name: annualincomeusd, type: float, unit: currency, required: true}
    - {name: monthlydebtusd, type: float, unit: currency, required: true}
    - {name: loanamountusd, type: float, unit: currency, required: true}
    - {name: propertyvalueusd, type: float, unit: currency, required: true}
    - {name: downpaymentusd, type: float, unit: currency, required: true}
    - {name: propertytype, type: enum}
    - {name: propertystate, type: string, required: true}
    - {name: occupancy, type: enum}
    - {name: loanpurpose, type: enum, required: true}
    - {name: vaeligible, type: bool}
    - {name: firsttimebuyer, type: bool}

derivedparameters:
  - name: dtipct
    expression: "monthlydebtusd / (annualincomeusd / 12.0) * 100.0"
    type: float
    unit: percentage
  - name: ltvpct
    expression: "loanamountusd / propertyvalueusd * 100.0"
    type: float
    unit: percentage

# The lender step binds `lender` for scoring (CEG-COR-012). The former
# `lenderstatelicensing` step (`lender-[:OPERATESIN]->st:State {statecode:
# $query.propertystate}`) is not expressible: traversal patterns forbid braces
# and parameters, so it refused every match. Licensing awaits an alias-aware
# gate (DEC-15 option A); the pack is dormant until then.
traversal:
  steps:
    - name: lenderresolve
      pattern: "(candidate:LoanProduct)-[:OFFEREDBY]->(lender:Lender)"
      required: true

gates:
  - name: creditscore_min
    type: threshold
    candidateprop: mincreditscore
    queryparam: creditscore
    operator: "<="
    nullbehavior: pass
  - name: dti_max
    type: threshold
    candidateprop: maxdtipct
    queryparam: dtipct
    operator: ">="
    nullbehavior: pass
  - name: ltv_max
    type: threshold
    candidateprop: maxltvpct
    queryparam: ltvpct
    operator: ">="
    nullbehavior: pass
  - name: loanamount_range
    description: >
      The borrower's requested loan amount falls inside the product's own
      [minloanamountusd, maxloanamountusd] window. The bounds live on the
      LoanProduct candidate and the amount on the query, so this is the
      candidate-window form; the earlier query-window spelling named two
      query parameters no queryschema field supplies (CEG-009d).
    type: range
    candidateprop_min: minloanamountusd
    candidateprop_max: maxloanamountusd
    queryparam: loanamountusd
    nullbehavior: pass
  - name: va_eligibility
    # An implication, not an equality (CEG-COR-005, DEC-13 option A): Cypher
    # orders false < true, so `requiresvaeligibility <= vaeligible` admits every
    # product for a VA-eligible borrower and only products that do not require
    # VA eligibility for one who is not.
    type: threshold
    candidateprop: requiresvaeligibility
    queryparam: vaeligible
    operator: "<="
    nullbehavior: pass
  - name: loanpurpose_match
    type: enummap
    candidateprop: loanpurpose
    queryparam: loanpurpose
  # No blacklist gate (CEG-COR-019, DEC-15): `blacklist_exclusion` declared
  # BLACKLISTEDLENDER from the query entity to the lender, but an exclusion gate
  # always anchors its edge at the candidate, so the compiler refuses it
  # (exclusion_endpoint_validation). Enforcement awaits a query-anchored
  # exclusion construct (DEC-15 option A); the pack is dormant until then.

scoring:
  dimensions:
    - name: rate_score
      source: candidateproperty
      candidateprop: baseratepct
      computation: inverselinear
      minvalue: 3.0
      maxvalue: 8.0
      weightkey: wrate
      defaultweight: 0.35
    - name: approval_rate
      # The lender's approval rate, read through the `lender` alias the
      # lenderresolve step binds (CEG-COR-070). `alias: lender.approvalratepct`
      # with `computation: candidateproperty` compiled to coalesce(candidate.value,
      # 0.0) — 0 for every product. approvalratepct is a 0-100 percentage, so it
      # is divided by 100 into [0, 1]; read raw it would saturate the clamp.
      source: traversalalias
      alias: lender
      candidateprop: approvalratepct
      computation: customcypher
      expression: "coalesce(lender.approvalratepct, 0.0) / 100.0"
      weightkey: wapproval
      defaultweight: 0.25
    - name: closing_speed
      source: candidateproperty
      candidateprop: avgclosingdays
      computation: inverselinear
      minvalue: 15
      maxvalue: 60
      weightkey: wspeed
      defaultweight: 0.20
    # No community_match dimension (CEG-COR-070, DEC-18 option B): it compared
    # LoanProduct.louvaincommunityid with $louvaincommunityid, which no
    # queryschema field supplies (a BorrowerProfile has no community) and no GDS
    # job writes, so it scored 0.5 for every product. The remaining weights are
    # unchanged (sum 0.80 <= 1.0): a constant term never changed the ranking.

compliance:
  regimes:
    - {name: ECOA, description: "Equal Credit Opportunity Act"}
  prohibitedfactors:
    enabled: true
    blockedfields: [race, ethnicity, religion, gender, age, maritalstatus, nationalorigin]
    enforcement: compiletime
  audit:
    enabled: true
    logmatchrequests: true
    logmatchresults: true
    retentiondays: 90
