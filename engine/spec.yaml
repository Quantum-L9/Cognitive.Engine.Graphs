# engine/spec.yaml — Node registration contract for Cognitive.Engine.Graphs
# Read by: constellation_node_sdk.registration.build_registration_payload
# Consumed by: Gate /v1/admin/register at node startup

node:
  id: graph
  version: "1.1.0"
  # CEG-005: declare the semantic owner instead of letting Gate infer it.
  # The SDK flattens node.owner into metadata.owner, and Gate's registration
  # ownership assertion is fail-closed for canonical actions. With no owner
  # here, registration succeeded only because Gate's _OWNER_ALIASES maps the
  # node name "graph" to "ceg" — correct today, and a name-based alias rather
  # than a declaration. Renaming the node would have broken registration for
  # every canonical action at once. EIE declares owner=eie for the same reason.
  owner: ceg
  type: engine
  internal_url: "http://graph:8000"
  health_endpoint: /v1/health
  priority_class: P1
  max_concurrent: 100
  timeout_ms: 30000

  # Advertised actions = the CEG-owned subset of engine.handlers.ACTION_HANDLERS
  # that Gate routes (seam audit 2026-09-02). Rules, enforced by
  # tests/architecture/test_seam_gate_only.py:
  #   * every advertised action has a registered handler;
  #   * `enrich` is NEVER advertised — Gate owns that name for EIE's
  #     enrichment operation; CEG's local Cypher-property `enrich` is reached
  #     only through Gate-authored packets that Gate will not route here;
  #   * `admin`/`health`/`healthcheck` are operator/probe surfaces, not
  #     collaboration routes, so they are not advertised either.
  actions:
    - match
    - sync
    - outcomes
    - resolve
