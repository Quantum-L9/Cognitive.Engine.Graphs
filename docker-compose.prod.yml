# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: graph
# layer: [docker]
# tags: [L9_TEMPLATE, docker, prod]
# owner: platform
# status: active
# --- /L9_META ---
#
# L9 Graph Cognitive Engine — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires: NEO4J_PASSWORD, API_SECRET_KEY, POSTGRES_PASSWORD, CEG_APP_DB_PASSWORD and CEG_DOMAINS_DIR env vars set (no defaults in prod)

services:

  # ── API Server (Production) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: l9-graph-api-prod
    ports:
      - "8000:8000"
    environment:
      L9_ENV: prod
      L9_LIFECYCLE_HOOK: engine.boot:GraphLifecycle
      # Seam audit 2026-09-02: SDK chassis is mandatory in prod (legacy chassis
      # is refused at startup). Gate is the only peer transport.
      L9_CHASSIS: sdk
      L9_ENVIRONMENT: production
      L9_SERVICE_NAME: graph-engine
      L9_SERVICE_VERSION: 1.1.0
      HOST: 0.0.0.0
      GATE_URL: ${GATE_URL:?GATE_URL must be set for production}
      GATE_ADMIN_TOKEN: ${GATE_ADMIN_TOKEN:?GATE_ADMIN_TOKEN must be set for production}
      GATE_REGISTRATION_ENABLED: "true"
      L9_NODE_NAME: graph
      # CEG-003: GATE_NODE_SPEC_PATH is the name the SDK reads. L9_NODE_SPEC_PATH
      # had no reader; registration survived only on the SDK's default.
      GATE_NODE_SPEC_PATH: engine/spec.yaml
      L9_ENFORCE_GATE_ONLY_INGRESS: "true"
      L9_GATE_NODE_NAME: gate
      L9_REQUIRE_SIGNATURE: "true"
      L9_SIGNING_ALGORITHM: hmac-sha256
      L9_SIGNING_KEY: ${L9_SIGNING_KEY:?L9_SIGNING_KEY must be set for production}
      L9_SIGNING_KEY_ID: ${L9_SIGNING_KEY_ID:-graph-engine-v1}
      # CEG-002: L9_REQUIRE_SIGNATURE=true also verifies the responses Gate
      # signs, and Gate signs with its own key id. Without this map CEG rejects
      # every signed Gate response ("no verifying key available for transport
      # signature verification"). Required, not defaulted: a wrong key here is a
      # silent trust failure, so production must state it — JSON object mapping
      # key id to key material, e.g. {"gate-v1":"<gate-key>"}.
      L9_VERIFYING_KEYS_JSON: ${L9_VERIFYING_KEYS_JSON:?L9_VERIFYING_KEYS_JSON must be set when L9_REQUIRE_SIGNATURE is true}
      # ACTION_HANDLERS minus `enrich` (Gate owns that name for EIE); includes the
      # canonical `health-assess` route (HEALTH-01). Parity with engine/spec.yaml is
      # asserted by tests/architecture/test_seam_gate_only.py.
      L9_ALLOWED_ACTIONS: match,sync,admin,outcomes,resolve,health,healthcheck,health-assess,score
      # GATE-KEY-01: Gate ed25519 key id(s); startup refuses prod without them and
      # refuses hmac-sha256 Gate signatures. score stays off (REMOTE_SCORE_ENABLED unset).
      L9_GATE_SIGNING_KEY_IDS: ${L9_GATE_SIGNING_KEY_IDS:?L9_GATE_SIGNING_KEY_IDS must name the Gate ed25519 key id(s) (GATE-KEY-01)}
      L9_MAX_ATTACHMENTS: "0"
      L9_MAX_ATTACHMENT_SIZE_BYTES: "0"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set for production}
      NEO4J_POOL_SIZE: "50"
      # W4-04 compliance audit flush -> packet_audit_log. CEG connects as the
      # app role (member of l9_product: INSERT/SELECT on the audit log, so it
      # stays append-only), never as the Postgres superuser, which bypasses RLS
      # and grants. Use a URL-safe password (e.g. openssl rand -hex 32).
      POSTGRES_DSN: postgresql://${CEG_APP_DB_USER:-ceg_app}:${CEG_APP_DB_PASSWORD:?CEG_APP_DB_PASSWORD must be set for production}@postgres:5432/${POSTGRES_DB:-l9_graph}
      # PacketStore (PERSIST-01): every Gate request/response pair, with lineage,
      # hop trace and delegation, in the same database as the same app role
      # (l9_product: INSERT, outcome_jsonb-only UPDATE, tenant RLS via
      # app.current_tenant). Store failures are warnings, never request failures.
      # No pruning is scheduled: prune_expired_packets() exists in
      # packet_store.sql but nothing calls it, so rows accumulate.
      PACKET_STORE_ENABLED: "true"
      PACKET_STORE_DSN: postgresql://${CEG_APP_DB_USER:-ceg_app}:${CEG_APP_DB_PASSWORD:?CEG_APP_DB_PASSWORD must be set for production}@postgres:5432/${POSTGRES_DB:-l9_graph}
      # W2-02b: link each recorded match outcome to its match packet in PacketStore.
      OUTCOME_PERSISTENCE_ENABLED: "true"
      API_SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY must be set for production}
      LOG_LEVEL: info
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      # #400 A3: the image ships no packs. The engine serves only the
      # operator-owned pack root mounted read-only below.
      DOMAINS_ROOT: /app/domains
      KGE_ENABLED: "true"
      KGE_CONFIDENCE_THRESHOLD: "0.3"
      KGE_EMBEDDING_DIM: "300"
      PARETO_ENABLED: "true"
    # #400 A3 / D1: operator-owned domain pack root (the directory
    # tools/publish_domain_pack.py publishes into), mounted read-only.
    # Required, not defaulted: production never falls back to repository packs.
    volumes:
      - ${CEG_DOMAINS_DIR:?CEG_DOMAINS_DIR must be set for production (absolute path of the operator-owned domain pack root)}:/app/domains:ro
    # CEG-007: redis was a depends_on: service_healthy here for a dependency
    # no code imports.
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - l9-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ── Neo4j 5.x Enterprise + GDS ──────────────────────────
  neo4j:
    image: neo4j:5.15-enterprise@sha256:b8491b6dcf998f216079d4793dde4b7d81759d8c05792fa48787c810e9e21e52
    container_name: l9-neo4j-prod
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_dbms_memory_heap_initial__size: 1g
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_pagecache_size: 1g
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - l9-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  # ── PostgreSQL 16: compliance audit store ───────────────
  # Schema (packet_store, lineage_graph, hop_trace, delegation_chain,
  # packet_audit_log; roles l9_product / l9_admin / l9_auditor) is applied from
  # engine/packet/packet_store.sql, then the CEG app login role is created.
  # Both run once, on an empty data volume. No published port: reachable only
  # from l9-net. Re-apply packet_store.sql by hand to upgrade an existing
  # database (safe since RU-080; see docs/FEATURE_GATES.md).
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: l9-graph-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-l9_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}
      POSTGRES_DB: ${POSTGRES_DB:-l9_graph}
      CEG_APP_DB_USER: ${CEG_APP_DB_USER:-ceg_app}
      CEG_APP_DB_PASSWORD: ${CEG_APP_DB_PASSWORD:?CEG_APP_DB_PASSWORD must be set for production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./engine/packet/packet_store.sql:/docker-entrypoint-initdb.d/01_packet_store.sql:ro
      - ./scripts/postgres-init/02_ceg_app_role.sh:/docker-entrypoint-initdb.d/02_ceg_app_role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always
    networks:
      - l9-net

volumes:
  neo4j-data:
  neo4j-logs:
  postgres-data:

networks:
  l9-net:
    name: l9-net
