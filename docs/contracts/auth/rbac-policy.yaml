additional_inconsistencies:
- id: AUTH-CAPSET-02
  source: engine/auth/capabilities.py:CapabilitySet.has_capability
  mechanism: Unconfigured or missing capability entries retain only approved public reads; write capabilities fail closed in production.
  required_disposition: source_remediated_local; retain explicit per-domain write grants and prove production ingress behavior
  status: source_remediated_local
- id: AUTH-GATE-03
  source: engine/spec.yaml vs chassis/handler_registration.py
  mechanism: Gate node spec (engine/spec.yaml) advertises 6 actions (match, sync, outcomes, resolve, health-assess, score); the SDK wrapper registers all 10 ACTION_HANDLERS including local admin/enrich; production L9_ALLOWED_ACTIONS (docker-compose.prod.yml) excludes enrich but admits admin, which only the handler admin:write check then guards (kept by operator decision 2026-11-11, Quantum-L9/Constellation.Gate#37). Registration is not equivalent to Gate routing authorization.
  required_disposition: prove direct-ingress refusal and owner-admitted route policy for every action
  status: unverified
- id: AUTH-DELEGATE-04
  source: engine/handlers.py:handle_admin delegate_capability branch
  mechanism: Delegation now requires source_tenant to equal the packet tenant and an existing active registered parent whose actions and domain scope cover the child. Payload input cannot synthesize a root.
  required_disposition: source_remediated_local; bind root registration and caller identity to canonical ingress for operational closure
  status: source_remediated_local
