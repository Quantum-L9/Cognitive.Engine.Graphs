inconsistency:
  id: AUTH-RESOLVE-01
  action: resolve
  side_effect: Creates RESOLVED_FROM edges, optionally performs batch resolution
  declared_permission: sync:write
  required_disposition: implemented with existing graph-write capability; read-only actor denial covered by native unit test
  status: source_remediated_local
policy_requirements:
- Authenticated Gate ingress with explicit caller-kind/tenant/action allowlist
- CEG tenant allowlist must authorize target DB; no caller database override
- Writes must demand a write permission even if handler is named resolve
- A production domain with no capability declaration, or no matching write grant, must deny the write
- CAPABILITY_AUTH_ENABLED=false is permitted only in dev, local, or test environments
- Local admin/enrich are not remotely exposed via Gate node-spec
required_proof:
- read-only caller denied resolve before graph query
- write-authorized caller can resolve in correct tenant
- wrong-tenant refusal
- Gate worker and consumer caller policies pass
- existing match permission not expanded
- unconfigured CapabilitySet cannot authorize untrusted writes in production
- missing permission entry cannot authorize untrusted writes
- SDK direct ingress for admin/enrich denied in production
- Gate main vs PR #31 acceptance evidence separately bound
- delegate_capability rejects forged source_tenant and unauthorized root synthesis
- revoke/capability_audit restricted to authorized operator
