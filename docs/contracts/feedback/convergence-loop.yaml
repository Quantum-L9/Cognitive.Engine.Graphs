weight_governance:
  issue: Quantum-L9/Cognitive.Engine.Graphs#462
  owner_decision:
    status: pending
    decision_owner: operator (issue #462 Decision 1, deferred 2026-11-11)
    options:
      approved_automatic_recalculation: set learned_weight_auto_apply_enabled=true (issue option b); each write appends an applied DimensionWeightChange
      candidate_only: keep the default; recalculations stay unapplied records (no weight moves); applying one is a separate, not yet built step (apply_weight_proposal persists nothing)
    record_when_decided: set status to decided with the decision, date and decider; the known-gap probe then passes and the path moves to CLOSED_GAPS with a CI receipt
  mechanism: docs/FEATURE_GATES.md §34 (append-only DimensionWeightChange per dimension; one transaction per recalculation; only learned_weight_auto_apply_enabled writes a weight)
  lost_update_guard: CI run 43130108743 on e56f973 recorded a stale prior (planner cached dw.weight before the lock; 16/20 local concurrent runs); fixed by locking in its own statement (0/20); the regression test fails on the old statement
  known_limit: two concurrent first writes of a MISSING DimensionWeight can each MERGE a node (no (dimension, tenant) uniqueness constraint; pre-existing)
  boost_factor: retired behind feedback_boost_propagation_enabled (default false); nothing reads boost_factor, so ranking is identical; propagation_boost_factor stays in the schema, inert
  method_findings_for_the_owner:
  - the per-dimension lift counts outcomes where <dim>_score IS NOT NULL (presence), not outcomes where the dimension scored high, as the recalculate_weights docstring describes; a lift therefore measures which dimensions were recorded, not whether they predict wins
  - no engine writer sets <dim>_score; the outcome handler stores fingerprint.dimension_scores (RU-005 JSON), so with signal_weight_dimension_scores_enabled off (default) every per-dimension count is 0 and every weight stays at the baseline. On, an outcome also counts when its stored dimension_scores records the dimension (presence, as before); FEATURE_GATES §36, tests/integration/test_feedback_dimension_scores.py
  - outcomes exist only for candidates that were matched and shown, so the win rates carry exposure/selection bias; there is no held-out comparison against the unchanged baseline
  - outcomes are deduplicated by outcome_id (FEEDBACK-IDEMP-01), but outcomes sharing one upstream event under different ids are counted as independent
  proof:
    unit: tests/unit/test_feedback_weight_governance.py
    integration: tests/integration/test_feedback_weight_governance.py
    local_run:
      neo4j_image: neo4j:5.18-enterprise (testcontainers)
      command: CEG_REQUIRE_INTEGRATION=1 pytest tests/integration/test_feedback_weight_governance.py tests/integration/test_feedback_convergence_closure.py tests/integration/test_score_propagator_integration.py tests/integration/test_dimension_weight_roundtrip.py tests/integration/test_outcomes_handler.py tests/integration/test_outcomes_causal_integrity.py
      result: 24 passed
      date: '2026-11-12'
    CI_run_id: null
