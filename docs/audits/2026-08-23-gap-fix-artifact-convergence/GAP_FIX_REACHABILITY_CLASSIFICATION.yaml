deferred_findings:
  - id: DEF-001
    title: 59 further engine modules are unreachable from production entrypoints
    severity: informational
    evidence: >
      The AST reachability analyzer reports 66 unreachable engine modules at base.
      Seven belong to this island and are removed by this PR. The remaining 59
      form unrelated dormant clusters — among them engine/health/**,
      engine/intake/**, engine/personas/**, engine/hoprag/**, engine/kge/**
      (kge is a documented dormant subsystem, kge_enabled=False),
      engine/arbitration/**, engine/outcomes/**, engine/replay/**,
      engine/shadow/**, and notably engine/gates/registry.py +
      engine/gates/types/all_gates.py, whose decorator-registered gate classes are
      never imported because engine/gates/__init__.py and
      engine/gates/compiler.py both bypass GateRegistry entirely.
    why_not_fixed_here: >
      Out of scope. The contract's non_scope forbids a general CEG refactor, and
      classifying 59 modules across nine unaudited subsystems is exactly the
      `broaden_into_unrelated_refactor` prohibition. Several are plausibly
      legitimate staged subsystems; several are plausibly dormant defects. Neither
      can be asserted without the same depth of evidence applied to this island.
    consequence_for_phase_9: see reachability_invariant_decision

reachability_invariant_decision:
  contract_preferred_design: full-tree static AST reachability gate over engine/
  implemented: NO — deferred with evidence
  rationale: >
    The contract's own design constraints for this invariant prohibit a
    `large_permanent_unreachable_baseline` and prohibit
    `adding_new_modules_to_baseline_to_make_test_green`. A full-tree gate at this
    base has 59 out-of-scope unreachable modules. Making it green would require
    either enumerating all 59 as exempt — the prohibited large baseline — or
    classifying all 59, which is the prohibited unrelated refactor. Both routes
    are closed, so shipping the full-tree gate here is not possible without
    violating the contract that asks for it.
  implemented_instead: >
    A narrow, fully provable invariant at the contract's preferred path,
    tests/invariants/test_module_reachability.py, that mechanically blocks
    resurrection of this island: the removed module paths must not reappear, no
    engine or chassis module may import the removed surfaces, no gap-fix
    activation recipe may reappear, and the canonical owners must remain the sole
    owners of the five responsibilities. It ships the reusable AST import-graph
    analyzer that the full-tree gate needs, and exercises it, so DEF-001 can be
    acted on later by tightening scope rather than by writing the analyzer.
  UNKNOWN_declared: >
    Whether each of the 59 remaining unreachable modules is a staged subsystem or
    a dormant defect is UNKNOWN at this evidence depth and is not guessed.
