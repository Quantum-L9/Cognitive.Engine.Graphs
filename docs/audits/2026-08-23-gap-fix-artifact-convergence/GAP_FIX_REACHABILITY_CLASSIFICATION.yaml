      - engine/convergence_controller_patch.py
      - tests/gap_fixes/test_gap1_contract.py
      - tests/gap_fixes/test_gap2_return_channel.py
    proof: >
      A second packet-envelope architecture with no shared type. Canonical
      engine/packet/ (PacketType StrEnum, frozen extra=forbid models, _compute_hash)
      is imported by chassis/actions.py, chassis/handler_registration.py,
      engine/handlers.py, engine/config/settings.py, tools/contract_scanner.py and
      tools/packet_envelope_gate.py. This module carries a private frozenset of
      packet-type STRINGS (graph_inference_result, schema_proposal, community_export,
      ...), a parallel required-fields table, and its own _compute_content_hash. Not
      one of its packet-type strings appears in the canonical enum. Once the three
      island importers go, every remaining importer is a test. Contract 05
      (Redefine PacketEnvelope) exactly.
    name_collision_checked:
      doc: docs/L9_Contract_Enforcement_System.md
      verdict: UNRELATED
      reason: >
        That document specifies the STATIC 24-contract system (tools/contract_scanner.py,
        tools/verify_contracts.py, pre-commit, CI gates) and never references this
        runtime module. Name similarity only.
    behavior_preservation_requirement: none — no production path validates through it
    proposed_action: DELETE
    validation_required:
      - tests/contracts/test_packet_envelope.py
      - tests/unit/test_packet_envelope.py
      - tests/unit/test_chassis_contract.py

  - path: engine/startup_wiring.py
    classification: STALE_PATCH
    confidence: CONFIRMED
    discovered_via: sole module presenting the island as installable wiring
    canonical_owner: engine/boot.py::GraphLifecycle
    runtime_callers: []
    reverse_imports: [tests/gap_fixes/test_gap9_inference_authority.py]  # reads source text
    unrunnable_proof: >
      apply_all_gap_fixes() cannot execute once. Its first statement is
      `from shared.audit_persistence import configure_audit_pool`; no `shared` package
      exists, so it raises ModuleNotFoundError before applying any fix. Two later
      imports name an absent top-level `graph` package — one of them OUTSIDE the try
      block guarding ImportError — and it then calls GDSScheduler.register_post_job_hook,
      which does not exist (AttributeError, uncaught).
    activation_instruction_hazard: >
      The Phase 13 surface. Its docstring reads "Add these calls to your application
      lifespan / startup handler in order" — a standing instruction to activate the
      six modules above. Deleting them and keeping this file would leave exactly the
      resurrection vector this contract exists to close.
    canonical_owner_proof: >
      GraphLifecycle is the sole startup/shutdown owner (E-001) and already creates
      the optional Postgres pool from settings.postgres_dsn, handing it to
      init_dependencies(db_pool=...) (E-002). boot.py contains no call to
      apply_all_gap_fixes and never has.
    behavior_preservation_requirement: >
      None from this file. The predecessor's guard (no undeclared spec.kb /
      load_domain_rules recipe may reappear) is preserved as a stronger tree-wide
      invariant rather than a source-text assertion against one file.
    proposed_action: DELETE
    validation_required:
      - tests/gap_fixes/test_gap9_inference_authority.py
      - tests/test_boot_and_registry.py

