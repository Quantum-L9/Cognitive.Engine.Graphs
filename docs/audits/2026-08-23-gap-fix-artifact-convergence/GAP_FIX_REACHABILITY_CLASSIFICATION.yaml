      ConvergenceLoop.on_outcome_recorded is outcome-feedback score propagation.
      It does not run passes, does not consume feature_vector confidence maps,
      does not perform schema discovery, and takes no domain_spec argument. The
      patch does not supply behavior missing from the canonical owner; it supplies
