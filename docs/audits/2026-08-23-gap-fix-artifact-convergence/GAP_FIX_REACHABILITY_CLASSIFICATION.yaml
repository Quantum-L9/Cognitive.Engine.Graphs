  - path: engine/graph/graph_sync_client_fix.py
    classification: STALE_PATCH
    confidence: CONFIRMED
    evidence:
      runtime_callers: []
      reverse_imports: []
      tests: []
      canonical_owner: engine/sync/generator.py::SyncGenerator (compiled by engine/handlers.py::handle_sync)
      architecture_refs: [docs/adr/ADR-DEC-001-candidate-identity.md]   # stale citation, corrected by this PR
      history_refs: [0979ff5, 998b4c7]
    transport_boundary_proof: >
      The module header instructs "Drop this over GraphSyncClient in
      graph/sync/client.py". No `graph/` package and no GraphSyncClient call site
      exist in CEG. The canonical sync path is
      engine/handlers.py::handle_sync -> engine/sync/generator.py::SyncGenerator,
      which compiles UNWIND MERGE/MATCH SET Cypher from the domain spec.
      The two write shapes are mutually incompatible:
        canonical : MERGE (n:<sanitized targetnode> {<sanitized idproperty>: ...})
                    SET n += row, n._tenant = $tenant
        orphan    : MERGE (n {entity_id: row.entity_id, tenant: $tenant})
                    SET n:Entity
      The orphan MERGEs a LABELLESS node on a hardcoded `entity_id` and writes
      `tenant`, not `_tenant`. Had it ever run it would have built a parallel,
      unqueryable node keyspace beside the canonical one.
    adr_citation_correction_required: true
    adr_finding: >
      ADR-DEC-001 (Accepted) cites `engine/graph/graph_sync_client_fix.py:113` as
      the place where the ungoverned `entity_id` candidate-identity property "is
      client-supplied at sync time". That citation is factually wrong: the code
      has never had a caller. Verified further: no domain spec declares
      `idproperty: entity_id` (plasticos uses facility_id, code, form_id,
      opportunity_id, demand_id), so no canonical writer of `entity_id` exists at
      all, while engine/handlers.py:509,616,1497 still READ it with silent
      fallbacks. The ADR's decision and its residual-risk finding both stand and
      are untouched; only the evidence pointer is corrected. Correcting it
      strengthens the ADR — the divergence is wider than recorded, not narrower.
    behavior_preservation_requirement: >
      None. Sync behavior is owned end-to-end by SyncGenerator and is unchanged.
    proposed_action: DELETE
    files_required_for_action:
      - engine/graph/graph_sync_client_fix.py
      - docs/adr/ADR-DEC-001-candidate-identity.md   # MODIFY: citation only
    validation_required: [tests/unit (sync), tests/test_handlers.py]

