      canonical_owner: engine/boot.py::GraphLifecycle
      architecture_refs: []
      history_refs: [0979ff5, 5815927]
    unrunnable_proof: >
      apply_all_gap_fixes() cannot execute even once. Its first statement is
      `from shared.audit_persistence import configure_audit_pool` — there is no
      `shared` package in this repository, so the call raises ModuleNotFoundError
