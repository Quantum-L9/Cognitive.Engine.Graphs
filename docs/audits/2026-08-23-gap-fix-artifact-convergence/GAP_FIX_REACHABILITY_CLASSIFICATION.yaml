    behavior_preservation_requirement: none — AuditLogger unchanged
    proposed_action: DELETE
    validation_required: [tests/test_compliance_engine.py, tests/invariants/test_compliance.py]

  - path: engine/graph_return_channel.py
    classification: ORPHANED_IMPLEMENTATION
    confidence: CONFIRMED
    canonical_owner: UNKNOWN — the responsibility does not exist in CEG
    runtime_callers: []
    reverse_imports:
      - engine/graph/community_export.py          # itself orphaned
      - engine/convergence_controller_patch.py    # itself orphaned
      - engine/startup_wiring.py                  # recipe, no caller, broken imports
      - tests/gap_fixes/test_gap2_return_channel.py
    proof: >
      Its docstring names its consumer as convergence_controller.run_convergence_loop().
      Neither exists in CEG. The canonical feedback owner, ConvergenceLoop, exposes
      only on_outcome_recorded() and never drains a queue. Every producer is an
      orphan, so nothing can enqueue; the consumer is absent, so nothing can drain.
    behavior_preservation_requirement: none — a queue with no producer and no consumer
    proposed_action: DELETE
    validation_required: [tests/unit (feedback), tests/test_boot_and_registry.py]

  - path: engine/graph/community_export.py
    classification: ORPHANED_IMPLEMENTATION
    confidence: CONFIRMED
    canonical_owner: engine/gds/scheduler.py::GDSScheduler._run_louvain
    runtime_callers: []
    reverse_imports: [engine/startup_wiring.py]   # via non-existent `graph.` package
    proof: >
      Instructs attachment to a "GDSScheduler post-job completion hook".
      GDSScheduler has no hook mechanism at all — unwireable, not merely unwired.
      Redundant regardless: _run_louvain writes the label into the graph via
      gds.louvain.write (writeproperty: community_id in domains/plasticos/spec.yaml)
      and engine/scoring/assembler.py reads community_id straight off the node.
      The graph is the transport.
    behavior_preservation_requirement: none — GDS write and scoring read unchanged
    proposed_action: DELETE
    validation_required: [tests/unit/test_gds_scheduler.py, tests/unit/test_hgkr_gds_dag.py]

  - path: engine/convergence_controller_patch.py
    classification: STALE_PATCH
    confidence: CONFIRMED
    canonical_owner: engine/feedback/convergence.py::ConvergenceLoop
    runtime_callers: []
    reverse_imports: []
    proof: >
      Instructs the operator to call patch_convergence_controller(), a function
      defined neither here nor anywhere else, to patch a convergence_controller.py
      that does not exist. Its four symbols have zero importers, not even a test.
      emit_schema_proposal dynamically imports chassis.events, which does not exist.
    behavior_comparison_with_canonical: >
      ConvergenceLoop.on_outcome_recorded is outcome-feedback score propagation: no
      passes, no feature-vector confidence maps, no schema discovery, no domain_spec
      argument. The patch supplies behavior for a different, absent subsystem — not
      behavior missing from the canonical owner.
    behavior_preservation_requirement: none — no canonical caller loses a capability
    proposed_action: DELETE
    validation_required: [tests/unit (feedback/convergence), tests/test_pareto_wiring.py]

  - path: engine/graph/graph_sync_client_fix.py
    classification: STALE_PATCH
    confidence: CONFIRMED
    canonical_owner: engine/sync/generator.py::SyncGenerator  # via handlers.py::handle_sync
    runtime_callers: []
    reverse_imports: []
    architecture_refs: [docs/adr/ADR-DEC-001-candidate-identity.md]  # stale citation, corrected
    proof: >
      A "drop this over GraphSyncClient in graph/sync/client.py" replacement for a
      package and call site that do not exist. Write shapes are incompatible:
        canonical: MERGE (n:<sanitized targetnode> {<sanitized idproperty>: ...})
                   SET n += row, n._tenant = $tenant
        orphan   : MERGE (n {entity_id: row.entity_id, tenant: $tenant}) SET n:Entity
      A labelless MERGE on a hardcoded entity_id writing `tenant`, not `_tenant`.
      Had it run it would have built a parallel, unqueryable node keyspace.
    adr_citation_correction_required: true
    adr_finding: >
      ADR-DEC-001 (Accepted) cites this file:113 as where the ungoverned `entity_id`
      is "client-supplied at sync time". The code never had a caller, and no domain
      spec declares idproperty: entity_id (plasticos uses facility_id, code, form_id,
      opportunity_id, demand_id), so no canonical writer of entity_id exists at all,
      while handlers.py:509,616,1497 still read it via silent fallbacks. Decision and
      residual-risk finding stand; only the evidence pointer is corrected. The
      correction widens the recorded divergence rather than narrowing it.
    behavior_preservation_requirement: none — SyncGenerator owns sync end to end
    proposed_action: DELETE
    validation_required: [tests/unit (sync), tests/test_handlers.py]

  - path: engine/contract_enforcement.py
    classification: TEST_ONLY_IMPLEMENTATION
    confidence: CONFIRMED
    discovered_via: reverse-import closure — not in the mandatory set
    canonical_owner: engine/packet/packet_envelope.py::PacketEnvelope
    runtime_callers: []
    reverse_imports:
