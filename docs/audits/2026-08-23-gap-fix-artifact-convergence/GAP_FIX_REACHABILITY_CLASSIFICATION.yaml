runtime_entrypoints_searched:
  - chassis/handler_registration.py::register_engine_handlers   # -> engine.handlers.ACTION_HANDLERS
  - chassis/actions.py::execute_action
  - chassis/chassis_app.py  (L9_LIFECYCLE_HOOK env -> importlib)
  - engine/boot.py::GraphLifecycle.startup
  - engine/boot.py::GraphLifecycle.shutdown
  - engine/boot.py::GraphLifecycle.execute
  - engine/boot.py::GraphLifecycle._compliance_flush_loop
  - engine/handlers.py  (8 action handlers: match, sync, admin, outcomes, resolve, health, healthcheck, enrich)
  - engine/gds/scheduler.py::GDSScheduler  (register_jobs / start / execute_job)
  - engine/feedback/convergence.py::ConvergenceLoop.on_outcome_recorded
  - engine/__init__.py  (packaged public API; pyproject packages = [{include = "engine"}])

method:
  static: git grep over engine chassis tests contracts domains docs tools Makefile .github
  ast: >
    Import-graph BFS over all 139 engine modules from the entrypoints above,
    modelling absolute imports, from-imports (symbol-or-submodule resolution),
    relative imports, function-level deferred imports, importlib.import_module
    string literals, and Python ancestor-package execution semantics
    (importing engine.a.b.c also executes engine.a.b and engine.a).
  cross_repo: >
    GitHub code search across org:Quantum-L9 for every island module path.
    Sole hit is a Cursor-Governance PLAN document, not a consumer. No code
    consumer exists in any Quantum-L9 repository.

artifacts:

  - path: engine/compliance/audit_persistence.py
    classification: ORPHANED_IMPLEMENTATION
    confidence: CONFIRMED
    evidence:
      runtime_callers: []
      reverse_imports: [tests/gap_fixes/test_gap5_audit.py]
      tests: [tests/gap_fixes/test_gap5_audit.py]
      canonical_owner: engine/compliance/audit.py::AuditLogger.flush_to_store
      architecture_refs: []
      history_refs: [0979ff5]
    duplicate_ownership_proof:
      canonical_path: >
        engine/boot.py creates the asyncpg pool from settings.postgres_dsn and
        passes it to init_dependencies(db_pool=...). EngineState owns it
        (engine/state.py::_db_pool) and closes it in shutdown().
        ComplianceEngine.flush_audit() delegates to
        AuditLogger.flush_to_store(db_pool), which INSERTs 16 typed columns into
        table `packet_audit_log`. The periodic flush loop and the shutdown final
        flush both drive this path.
      orphan_path: >
        audit_persistence keeps its OWN module-global `_POOL`, set only by
        configure_audit_pool(), which nothing calls. It CREATEs and INSERTs into
        a DIFFERENT table `audit_log` with 5 untyped columns built from raw
        dicts. Two competing audit schemas, one owner.
    behavior_preservation_requirement: >
      None. Audit persistence behavior is entirely owned by AuditLogger and is
      unchanged by removing this module.
    proposed_action: DELETE
    files_required_for_action:
      - engine/compliance/audit_persistence.py
      - tests/gap_fixes/test_gap5_audit.py
    validation_required: [tests/test_compliance_engine.py, tests/invariants/test_compliance.py]

