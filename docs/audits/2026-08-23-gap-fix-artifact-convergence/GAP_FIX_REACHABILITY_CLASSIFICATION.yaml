artifacts:

  - path: engine/compliance/audit_persistence.py
    classification: ORPHANED_IMPLEMENTATION
    confidence: CONFIRMED
    canonical_owner: engine/compliance/audit.py::AuditLogger.flush_to_store
    runtime_callers: []
    reverse_imports: [tests/gap_fixes/test_gap5_audit.py]
    proof: >
      Own module-global _POOL, set only by configure_audit_pool(), which nothing
      calls; INSERTs 5 untyped columns into `audit_log`. Canonical path is
      boot.py -> init_dependencies(db_pool) -> EngineState ->
      ComplianceEngine.flush_audit -> AuditLogger.flush_to_store, writing 16
