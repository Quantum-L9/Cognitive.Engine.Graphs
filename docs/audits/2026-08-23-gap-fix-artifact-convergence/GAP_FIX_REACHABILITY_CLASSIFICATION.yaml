deferred_findings:
  - id: DEF-001
    title: 59 further engine modules are unreachable from production entrypoints
    severity: informational
    evidence: >
      The analyzer reports 66 unreachable engine modules at base; 7 are this island.
      The other 59 are unrelated dormant clusters: engine/health/**, engine/intake/**,
      engine/personas/**, engine/hoprag/**, engine/kge/** (documented dormant,
      kge_enabled=False), engine/arbitration/**, engine/outcomes/**, engine/replay/**,
      engine/shadow/**, and notably engine/gates/registry.py +
      engine/gates/types/all_gates.py, whose decorator-registered gate classes are never
      imported because engine/gates/__init__.py and engine/gates/compiler.py both bypass
      GateRegistry entirely.
    why_not_fixed_here: >
      Out of scope. non_scope forbids a general CEG refactor, and classifying 59 modules
      across nine unaudited subsystems is the `broaden_into_unrelated_refactor`
      prohibition. Some are plausibly legitimate staged subsystems, some plausibly
      dormant defects; neither can be asserted without this island's evidence depth.

reachability_invariant_decision:
  contract_preferred_design: full-tree static AST reachability gate over engine/
  implemented: NO — deferred with evidence
  rationale: >
    The contract's own constraints for this invariant prohibit a
    `large_permanent_unreachable_baseline` and `adding_new_modules_to_baseline_to_make_test_green`.
    A full-tree gate at this base has 59 out-of-scope unreachable modules; going green
    needs either a 59-entry exemption list (the prohibited baseline) or a 59-module
    classification sweep (the prohibited refactor). Both routes are closed, so shipping
    the full-tree gate here would violate the contract that asks for it.
  implemented_instead: >
    tests/invariants/test_module_reachability.py — removed paths stay absent, no engine
    or chassis module imports the removed surfaces or symbols, no gap-fix activation
    recipe reappears, and the canonical owners remain present and production-reachable.
    Ships and exercises the reusable AST analyzer the full gate needs, so DEF-001 can be
    acted on by tightening scope rather than writing machinery.
  UNKNOWN_declared: >
    Whether each of the 59 remaining unreachable modules is a staged subsystem or a
    dormant defect is UNKNOWN at this evidence depth and is not guessed.
