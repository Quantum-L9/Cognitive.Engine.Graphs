    activation_instruction_hazard: >
      This is the Phase 13 surface. The module docstring reads "Add these calls to
      your application lifespan / startup handler in order." It is an executable
      instruction to an operator or a future agent to activate five components
      this PR removes. Deleting the five artifacts and keeping this file would
      leave precisely the resurrection vector the contract exists to close.
    canonical_owner_proof: >
      engine/boot.py::GraphLifecycle is the sole startup/shutdown owner (E-001).
      It already performs the only responsibility from this recipe that CEG
      actually has: it creates the optional Postgres pool from
      settings.postgres_dsn and hands it to init_dependencies(db_pool=...) (E-002).
      boot.py contains no call to apply_all_gap_fixes and never has.
    behavior_preservation_requirement: >
      None. The file has never contributed runtime behavior. The behavior that
      MUST be preserved is the regression guard added by predecessor #232 —
      "no undeclared spec.kb / load_domain_rules recipe may reappear" — which is
      re-expressed as a stronger tree-wide invariant rather than a source-text
