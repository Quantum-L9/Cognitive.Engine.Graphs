[project]
name = "l9-engine"
version = "0.1.0"
description = "Domain-agnostic graph-native matching engine"
readme = "README.md"
authors = [{ name = "L9", email = "eng@l9.dev" }]
requires-python = ">=3.12,<3.13"
# Runtime dependencies: what the images install (tools/deps/install_locked.sh runtime).
dependencies = [
    "fastapi>=0.135.1,<0.163.0",
    "uvicorn[standard]>=0.42,<0.55",
    "neo4j>=5.25.0,<6.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "types-PyYAML>=6.0",
    "python-multipart>=0.0.9,<1.0.0",
    "apscheduler>=3.10.0,<4.0.0",
    "httpx>=0.28.0,<0.29.0",
    "structlog>=25.5.0,<27.0.0",
    "prometheus-client>=0.24.1,<1.0.0",
    "numpy>=2.4.3,<3.0.0",
    "openai>=1.0.0,<2.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "constellation-node-sdk",
]

# One lock (uv.lock) resolves the project and every group together; install
# profiles select groups (tools/deps/install_locked.sh). Core-owned tools (pip,
# pre-commit, ruff, mypy, pytest, semgrep) are declared nowhere here: they are
# excluded from the lock below and installed from Quantum-L9/l9-ci-core's
# installer pins, so a Core bump needs no edit in this repository
# (tests/unit/test_core_toolchain_pins.py).
[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov==7.1.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "faker>=40.5.1,<41.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "openapi-spec-validator==0.9.0",
    "hypothesis>=6.100,<7",
    "testcontainers[neo4j]>=4.8.0,<5.0.0",
]
ci = [
    "types-PyYAML==6.0.12.20250915",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyyaml>=6.0.0",
    "neo4j>=5.0.0",
    "structlog>=24.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov==7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.100,<7",
    "httpx>=0.27.0",
    "jsonschema==4.26.0",
    "pip-licenses>=5.5.5",
]
tools = [
    "pyyaml==6.0.3",
    "yamllint==1.38.0",
]
licenses = [
    "pip-licenses==5.5.5",
]

[tool.uv]
# An application, not a distribution: uv never builds or installs the project itself.
package = false
# Core-owned tools never enter uv.lock, even transitively (pytest plugins require
# pytest, pip-audit requires pip): a locked copy would drift the next time Core
# moves. tools/deps/install_locked.sh installs them from Core's installer pins.
# Names only, never versions. Core list: l9-ci-core
# .github/actions/install-consumer-ci/core-owned-tools.json.
exclude-dependencies = ["bandit", "mypy", "pip", "pip-audit", "pre-commit", "pytest", "ruff", "semgrep", "uv"]

[tool.uv.sources]
# Policy (CEG#266): the manifest names Gate_SDK's moving major tag; uv.lock records
# the commit it resolved to (scripts/validate_sdk_pin.py).
constellation-node-sdk = { git = "https://github.com/Quantum-L9/Gate_SDK.git", tag = "v1" }

[tool.coverage.run]
source = ["engine"]
omit = ["engine/db/*", "tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["odoo-consumer"]  # pinned consumer checkout (.l9/external-checkout.json)

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM",
    "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "PIE", "PT", "RET", "TCH", "ARG", "PTH", "PL", "TRY", "RUF",
    "S",        # flake8-bandit: security checks (harvested from L9 Kernel)
    "ASYNC",    # flake8-async: async antipattern detection (harvested from L9 Kernel)
    "TID",      # flake8-tidy-imports: banned deprecated APIs (DomainSpecLoader → DomainPackLoader)
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "TRY003",   # long exception messages (acceptable in domain code)
    "TRY400",   # logging.error vs logging.exception (acceptable)
    "EM101",    # raw string in exception (acceptable)
    "EM102",    # f-string in exception (acceptable)
    "PLR0913",  # too many arguments (audit/compliance APIs need many params)
    "PLR0912",  # too many branches (complex validation logic)
    "PLR0911",  # too many return statements (acceptable in tools)
    "PLR2004",  # magic value comparison (acceptable in tests/config)
    "TC001",    # typing-only first-party import (causes runtime issues)
    "TC003",    # typing-only stdlib import (causes runtime issues)
    "ARG001",   # unused function argument (often needed for interface compliance)
    "ARG002",   # unused method argument (often needed for interface compliance)
    "ARG003",   # unused class method argument (interface compliance)
    "ARG005",   # unused lambda argument (interface compliance)
    "PT011",    # pytest.raises too broad (acceptable in unit tests)
    "SIM102",   # collapsible if (readability preference)
    "SIM105",   # contextlib.suppress (explicit try/except is clearer)
    "RET504",   # unnecessary assign before return (readability)
    "PLC0415",  # import outside top-level (acceptable for lazy imports)
    "PLW0603",  # global statement (acceptable for module-level singletons)
    "DTZ005",   # datetime.now without tz (scheduler uses local time)
    "RUF012",   # mutable class default (ClassVar annotation not always needed)
    "RUF013",   # implicit Optional (legacy code)
    "TRY004",   # TypeError vs other exception (acceptable)
    "B007",     # unused loop control variable (acceptable)
    "E741",     # ambiguous variable name (acceptable in tools)
    "PLC0206",  # dict index missing items (acceptable)
    "S104",     # bind 0.0.0.0 — containerized services
    "S110",     # try-except-pass — optional feature degradation
    "S112",     # try-except-continue — resilient batch operations
    "S311",     # non-crypto random — scoring jitter, test data
    "S108",     # hardcoded tmp — containerized, ephemeral
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "S108", "ARG001", "ARG002", "PLR2004", "PT011", "B017", "F841", "SIM117", "RUF043"]
"tests/fixtures/design_packs/**" = ["PTH123"]
"engine/packet/test_*.py" = ["B017"]
"engine/packet/packet_store.py" = ["TRY300"]
"scripts/**" = ["S603", "S607", "E402"]
# FeatureNotEnabled is a stable, serialized error-type name consumed by API
# clients (chassis error envelope `error` field) and asserted in tests.
# Renaming to satisfy N818's Error-suffix convention would be a breaking
# wire-format change, so it is intentionally kept as-is.
"chassis/errors.py" = ["N818"]
"tools/**" = ["S603", "S607", "TRY300", "PTH123", "PLR0915", "PLW1510", "E402", "B904", "TID251"]
"auth/**" = ["S101", "S105", "S106", "TC002", "TRY301", "TRY401"]
"chassis/**" = ["TRY300", "TRY301", "TRY401", "S105", "B027", "B904"]
"chassis/auth/test_*.py" = ["S101", "S105", "S106"]
"engine/config/**" = ["S105", "PLR0915"]
"engine/handlers.py" = ["PLR0915"]
"engine/security/**" = ["S102", "E402", "B904", "TRY300", "UP047", "TRY301"]

# ---------------------------------------------------------------------------
# Deprecated API enforcement — DomainSpecLoader is banned, use DomainPackLoader
# Detected by TID251 (flake8-tidy-imports). Rule fires on any import of the
# deprecated symbol from engine.config.loader.
# Auto-fix: python tools/check_deprecated_imports.py --fix .
# ---------------------------------------------------------------------------
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"engine.config.loader.DomainSpecLoader" = {msg = "DomainSpecLoader was renamed to DomainPackLoader (commit 4c0fb5868b). Use: `from engine.config.loader import DomainPackLoader` and `DomainPackLoader(config_path=str(SPEC_PATH))`. Auto-fix: python tools/check_deprecated_imports.py --fix ."}

[tool.mypy]
python_version = "3.12"
warn_return_any = true              # catch untyped returns (harvested from L9 Kernel)
warn_unused_configs = true
warn_unreachable = true             # catch dead code paths (harvested from L9 Kernel)
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]         # Pydantic model type awareness (harvested from L9 Kernel)
exclude = [
    "^current work/",
    "^harvest_staging/",
    "^docs/",
    "^tests/fixtures/design_packs/",
]

[tool.pydantic-mypy]
init_forbid_extra = true            # Flag extra fields in model __init__
init_typed = true                   # Enforce typed __init__ params
warn_required_dynamic_aliases = true # Catch alias misuse

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "tools.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "chassis.*"
ignore_errors = true

[tool.l9_meta]
l9_schema = 1
origin = "engine-specific"
engine = "graph"
layer = ["build", "config"]
tags = ["build", "dependencies", "uv"]
owner = "engine-team"
status = "active"
