# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: graph
# layer: [audit]
# tags: [L9_TEMPLATE, audit-rules]
# owner: platform
# status: active
# --- /L9_META ---
#
meta:
  L9_TEMPLATE: true
  name: "L9 Engine Audit Rules"
  version: "2026-03-01"

rules:
  - id: "ARCH_NO_FASTAPI_IN_ENGINE"
    severity: "CRITICAL"
    description: "Engine code must not import FastAPI/Starlette/Uvicorn (chassis owns HTTP)."
    include_globs: ["engine/**/*.py"]
    exclude_globs: ["engine/handlers.py"]
    patterns:
      - "import fastapi"
      - "from fastapi import"
      - "import starlette"
      - "from starlette import"
      - "import uvicorn"
      - "from uvicorn import"

  - id: "ARCH_NO_CUSTOM_ROUTES_DIR"
    severity: "CRITICAL"
    description: "engine/api directory must not exist."
    file_exists_forbidden:
      - "engine/api"

  - id: "ARCH_NO_TENANT_RESOLUTION"
    severity: "HIGH"
    description: "Tenant resolution must be chassis-only; engine must not implement tenant parsing logic."
    include_globs: ["engine/**/*.py"]
    patterns:
      - "resolve_tenant"
      - "X-Domain-Key"
      - "X-Tenant-Key"

  - id: "SEC_LABEL_SANITIZATION_REQUIRED"
    severity: "CRITICAL"
    description: "All f-string Cypher that interpolates labels/types must use sanitize_label()."
    include_globs: ["engine/**/*.py"]
    # Evaluated by tools/cypher_lint.py (the C-009 owner, AST provenance per
    # interpolated expression); every blocking finding is reported here.
    check: "cypher_lint"

  # The TRACE_*_FLOW_ANCHORS rules state where each flow is anchored, as
  # required_all checks scoped to one module-level definition (within_function
  # / within_class, tools/audit_engine.py). Before, they were per-file checks
  # over a glob: TRACE_MATCH / TRACE_SYNC were required_any over every
  # top-level engine/*.py module (#456), so 16 modules that can never hold a
  # flow (engine/__init__.py, engine/state.py, ...) were reported on every run,
  # and any one token anywhere in engine/handlers.py satisfied them. TRACE_GDS
  # was evaluated against engine/gds/__init__.py too. Now each rule names the
  # entrypoint that owns the flow and requires every component it promises:
  # removing GateCompiler(...) from handle_match, or _run_louvain from
  # GDSScheduler, is a finding, and so is renaming or moving the definition or
  # its file (an empty scope is a finding, never a vacuous pass). Pinned by
  # tests/unit/test_audit_rule_scope.py.
  - id: "TRACE_MATCH_FLOW_ANCHORS"
    severity: "MEDIUM"
    description: "Match flow should reference GateCompiler, TraversalAssembler, ScoringAssembler, GraphDriver.execute_query."
    include_globs: ["engine/handlers.py"]
    within_function: "handle_match"
    required_all:
      - "GateCompiler("
      - "TraversalAssembler("
      - "ScoringAssembler("
      - "execute_query("

  - id: "TRACE_SYNC_FLOW_ANCHORS"
    severity: "MEDIUM"
    description: "Sync flow should reference SyncGenerator and execute_query."
    include_globs: ["engine/handlers.py"]
    within_function: "handle_sync"
    required_all:
      - "SyncGenerator("
      - "generate_sync_query("
      - "execute_query("

  - id: "TRACE_GDS_FLOW_ANCHORS"
    severity: "MEDIUM"
    description: "GDS scheduler should exist and include known algorithms."
    include_globs: ["engine/gds/scheduler.py"]
    within_class: "GDSScheduler"
    required_all:
      - "def register_jobs("
      - "def execute_job("
      - "def _run_louvain("
      - "def _run_cooccurrence("
      - "def _run_reinforcement("
      - "def _run_temporal_recency("
