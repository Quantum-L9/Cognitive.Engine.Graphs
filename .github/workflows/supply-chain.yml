#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Universal CI/CD Pack — Supply Chain Security
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VERSION: 1.0.0
# PURPOSE: OpenSSF Scorecard, dependency review, SBOM generation, license compliance
# FEATURES: Automated security posture assessment and supply chain protection
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Supply Chain Security

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday at 3 AM UTC
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default at workflow level; each job below grants only the
# write scopes it needs (scorecard: security-events/id-token; sbom: id-token;
# dependency-review: pull-requests). Keeps elevated permissions job-scoped.
permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}

jobs:
# ────────────────────────────────────────────────────────────────────────
# OpenSSF Scorecard — Supply Chain Security Assessment
# ────────────────────────────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      # Private repository: scorecard-action documents these reads as needed
      # for the GitHub GraphQL calls (ListCommits etc.); without them the run
      # fails with "Resource not accessible by integration".
      issues: read
      pull-requests: read
      checks: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard Analysis
        # v2.4.4 action.yaml image is docker://ghcr.io/ossf/scorecard-action:v2.4.4
        # Do not pin v2.4.0 — that tag still docker-pulls gcr.io/openssf (billing denied).
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard Results to Security Tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: scorecard.sarif

      - name: Upload Scorecard Results as Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 30

# ────────────────────────────────────────────────────────────────────────
# Dependency Review — Block Risky Dependencies in PRs
# ────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Check Dependency Graph Availability
        id: depgraph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT=$(gh api "repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.sha }}" 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph unavailable (enable Dependency graph in repo Security settings). Skipping Dependency Review."
            echo "$OUT"
          fi

      - name: Review Dependencies
        if: steps.depgraph.outputs.available == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          # dependency-review-action rejects specifying both allow-licenses and
          # deny-licenses. Keep the allow-list (stricter); deny-list is implied.
          # SPDX AND compounds in allow-licenses do not match package Dual
          # licenses and also break MIT matching (upload-artifact 7.0.1).
          # Policy lives here, not in vars.ALLOWED_LICENSES (operator decision
          # 2026-11-11): permissive licences only. uv.lock is the first lock
          # GitHub's dependency graph reads, which surfaced MPL-2.0 (certifi,
          # hypothesis, pathspec), PSF-2.0 (defusedxml, distlib, pywin32) and
          # MIT-0 (cffi) in the existing dependency set.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, MPL-2.0, PSF-2.0,
            Python-2.0, MIT-0, 0BSD, Zlib, CC0-1.0, HPND-Markus-Kuhn
          # Exempted by name, each reviewed 2026-11-11:
          # - AND-compounds of allowed licences, which this action does not
          #   match: colorama, httpcore, nodeenv (BSD-2 AND BSD-3); sniffio,
          #   types-pyyaml, pip-requirements-parser (Apache-2.0 AND MIT);
          #   pip-audit (Apache-2.0 AND ISC); cyclonedx-python-lib (Apache-2.0
          #   AND Python-2.0); tqdm (MPL-2.0 AND MIT); wcwidth (HPND AND MIT);
          #   numpy (BSD-3 AND 0BSD AND MIT AND Zlib AND CC0-1.0); mypy (MIT AND
          #   Python-2.0 AND BSD-2-Clause, Core-owned dev tool).
          # - typing-extensions: PSF-2.0; the detected "GPL-1.0-or-later" comes
          #   from the PSF licence history text, not a GPL grant.
          # - yamllint: GPL-3.0, a CI-only linter (tools profile), never shipped
          #   in an image.
          # - structlog, prometheus-client: existing exemptions.
          allow-dependencies-licenses: >-
            pkg:pypi/structlog, pkg:pypi/prometheus-client, pkg:pypi/mypy,
            pkg:pypi/colorama, pkg:pypi/httpcore, pkg:pypi/nodeenv,
            pkg:pypi/sniffio, pkg:pypi/types-pyyaml, pkg:pypi/pip-requirements-parser,
            pkg:pypi/pip-audit, pkg:pypi/cyclonedx-python-lib, pkg:pypi/tqdm,
            pkg:pypi/wcwidth, pkg:pypi/numpy, pkg:pypi/typing-extensions,
            pkg:pypi/yamllint
          comment-summary-in-pr: on-failure

# ────────────────────────────────────────────────────────────────────────
# SBOM Generation — Software Bill of Materials
# ────────────────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: true

# ────────────────────────────────────────────────────────────────────────
# License Compliance — Enforce Approved Licenses
# ────────────────────────────────────────────────────────────────────────
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          # pip-licenses reports on what is installed: the locked runtime set
          # (pyproject.toml [project] dependencies + the Gate SDK) plus pip-licenses.
          bash tools/deps/install_locked.sh runtime

      - name: Check License Compliance
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "License Compliance Check"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          # pip-licenses reports human-readable names (e.g. "MIT License"),
          # SPDX ids ("MIT"), and compound expressions. Keep both styles.
          # Proprietary covers first-party constellation-node-sdk.
          ALLOW="${{ vars.PIP_LICENSES_ALLOW || 'MIT;MIT License;MIT-0;MIT OR Apache-2.0;Apache-2.0;Apache Software License;Apache Software License; MIT License;Apache License 2.0;Apache-2.0 OR BSD-3-Clause;Apache-2.0 AND BSD-2-Clause;BSD;BSD License;BSD-3-Clause;BSD-2-Clause;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;ISC;PSF-2.0;Python Software Foundation License;Mozilla Public License 2.0 (MPL 2.0);MPL-2.0;MPL-2.0 AND MIT;Proprietary' }}"
          DENY="${{ vars.PIP_LICENSES_DENY || 'GPL-3.0;AGPL-3.0;LGPL-3.0' }}"

          echo "Allowed licenses: $ALLOW"
          echo "Denied licenses: $DENY"
          echo ""

          # Generate report
          pip-licenses --format=json --output-file=licenses.json
          pip-licenses --format=markdown --output-file=licenses.md

          # Check compliance
          pip-licenses \
            --allow-only="$ALLOW" \
            --fail-on="$DENY" \
            --format=plain-vertical

          echo ""
          echo "✅ All dependencies use approved licenses"

      - name: Upload License Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: |
            licenses.json
            licenses.md
          retention-days: 30

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# END OF SUPPLY CHAIN SECURITY
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
