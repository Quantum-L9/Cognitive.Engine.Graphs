# L9 Consumer Lint + Test — Python Preset (LOCKED STRUCTURE)
#
# DO NOT EDIT workflow structure — only the env: block is consumer-configurable.
# Managed by l9-ci-core presets/python.
#
# Conventions:
#   - Immutable event-revision checkout (no floating action ref)
#   - SHA-pinned external actions
#   - Least privilege (contents: read only)
name: L9 Lint and Test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# ── CONFIGURABLE: agent sets these during activation ───────────────────────────
env:
  PYTHON_VERSION: "3.12"
  SOURCE_DIR: "."
  TEST_DIR: "tests/"
  COVERAGE_THRESHOLD: "0"
  PYTEST_PARALLEL: "false"
  MYPY_EXCLUDE: ""

permissions:
  contents: read

concurrency:
  group: l9-lint-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: bash tools/deps/install_locked.sh ci

      - name: ruff check
        run: ruff check "${SOURCE_DIR}" --output-format=github

      - name: ruff format --check
        run: ruff format --check "${SOURCE_DIR}"

      - name: mypy
        run: |
          set -euo pipefail
          # Align with make lint / ci.yml / ci-quality.yml: type-check engine/
          # only. mypy on SOURCE_DIR=. dual-maps tools/auditors and fails closed
          # before any engine diagnostics are useful.
          mkdir -p .mypy_cache
          mypy engine/ \
            --config-file=pyproject.toml \
            --ignore-missing-imports \
            --exclude chassis \
            --show-error-codes --pretty

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout immutable event revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
          git remote set-url origin "https://github.com/${REPOSITORY}.git"

      - name: Checkout pinned Odoo consumer
        uses: Quantum-L9/l9-ci-core/.github/actions/checkout-external@043f50ac41af17bf814f811076c5b48a640d9a2e
        with:
          token: ${{ secrets.L9_GITHUB_READ_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test tools
        run: bash tools/deps/install_locked.sh full

      - name: pytest with coverage
        env:
          TESTING: "true"
          L9_ODOO_CONSUMER: ${{ github.workspace }}/odoo-consumer
        run: |
          set -euo pipefail
          XDIST_ARGS=()
          if [ "${PYTEST_PARALLEL}" = "true" ]; then
            XDIST_ARGS=(-n auto)
          fi
          PYTHONPATH=. pytest "${TEST_DIR}" \
            "${XDIST_ARGS[@]}" \
            --cov="${SOURCE_DIR}" \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_THRESHOLD}" \
            --timeout=300 --tb=short -v
