# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: graph
# layer: [ci]
# tags: [L9_TEMPLATE, ci, contracts]
# owner: platform
# status: active
# --- /L9_META ---
# L9 Contract Enforcement — 24 invariants / 27 docs as hard gates
# Blocks merge on missing contract files or scanner violations.

name: Contract Enforcement

on:
  push:
  pull_request:

jobs:
  action-refs:
    name: Validate Action References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Guard against malformed `@<sha>v<version>` "Frankenrefs" that make
      # every job in an affected workflow unrunnable, and reject every
      # non-local action reference that is not SHA-pinned.
      - run: python3 tools/check_action_refs.py

  contract-files:
    name: Verify Contract Files Exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: bash tools/deps/install_locked.sh ci
      - run: python tools/verify_contracts.py

  contract-scan:
    name: Scan for Contract Violations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: bash tools/deps/install_locked.sh ci
      - run: python tools/contract_scanner.py

  meta-headers:
    name: Verify L9_META Headers
    runs-on: ubuntu-latest
    steps:
      # fetch-depth is irrelevant here, but the checkout must be a real git repo:
      # discovery enumerates via `git ls-files -z`, not a filesystem walk.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      # Default mode is dry-run verification (same as `check`); exits 1 when any
      # eligible file is PENDING, MISSING, NOHEADER, INVALID or ERROR. Stdlib only.
      - run: python tools/l9_meta_injector.py

  lint:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: bash tools/deps/install_locked.sh ci
      - run: ruff check . && ruff format --check .
      # Keep type enforcement aligned with ci.yml, ci-quality.yml, and pyproject.toml.
      - run: mypy engine/ --config-file=pyproject.toml --ignore-missing-imports --exclude chassis

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [contract-files, contract-scan, meta-headers, lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Checkout pinned Odoo consumer
        uses: Quantum-L9/l9-ci-core/.github/actions/checkout-external@043f50ac41af17bf814f811076c5b48a640d9a2e
        with:
          token: ${{ secrets.L9_GITHUB_READ_TOKEN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - run: bash tools/deps/install_locked.sh full
      - name: Test Suite
        env:
          L9_ODOO_CONSUMER: ${{ github.workspace }}/odoo-consumer
        run: PYTHONPATH=. pytest tests/ -v --tb=short
