# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: graph
# layer: [ci]
# tags: [L9_TEMPLATE, ci, compliance]
# owner: platform
# status: active
# --- /L9_META ---
#
name: Architecture Compliance Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          bash tools/deps/install_locked.sh full

      - name: Banned engine files and design-pack DomainSpec validation
        # tools/check_compliance_layout.py is the one owner; Repo.mk
        # repo-validate runs the same script in Analyze (central Core).
        run: python tools/check_compliance_layout.py

      - name: Check for FastAPI imports in engine/
        run: |
          # Allow chassis imports ONLY in engine/handlers.py
          violations=$(grep -rl "from fastapi import\|import fastapi" engine/ --include="*.py" | grep -v "engine/handlers.py" || true)
          if [ -n "$violations" ]; then
            echo "ERROR: FastAPI imports found in engine/ (only handlers.py allowed):"
            echo "$violations"
            exit 1
          fi
