# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: graph
# layer: [ci]
# tags: [L9_TEMPLATE, ci, compliance]
# owner: platform
# status: active
# --- /L9_META ---
#
name: Architecture Compliance Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          bash tools/deps/install_locked.sh full

      - name: Check for banned files
        run: |
          # Fail if engine/middleware.py exists (tenant resolution is chassis-only)
          if [ -f "engine/middleware.py" ]; then
            echo "ERROR: engine/middleware.py exists (tenant resolution is chassis-only)"
            exit 1
          fi
          # Fail if engine/api/ directory exists (app factory is in chassis/chassis_app.py)
          if [ -d "engine/api" ]; then
            echo "ERROR: engine/api/ directory exists (app factory belongs in chassis/)"
            exit 1
          fi

      - name: Check for FastAPI imports in engine/
        run: |
          # Allow chassis imports ONLY in engine/handlers.py
          violations=$(grep -rl "from fastapi import\|import fastapi" engine/ --include="*.py" | grep -v "engine/handlers.py" || true)
          if [ -n "$violations" ]; then
            echo "ERROR: FastAPI imports found in engine/ (only handlers.py allowed):"
            echo "$violations"
            exit 1
          fi

      - name: Check for Cypher injection patterns
        run: |
          # Delegate to the repository's canonical scanner; do not maintain a second regex.
          python tools/contract_scanner.py

      - name: Run ruff linter
        run: ruff check .

      - name: Run mypy type checker
        run: mypy engine/ --config-file=pyproject.toml --ignore-missing-imports --exclude chassis

      - name: Validate domain specs
        run: |
          # Every pack under tests/fixtures/design_packs/<id>/spec.yaml must load as a DomainSpec.
          # The former glob ('*_domain_spec.yaml') matched no file, so this step
          # validated nothing (Stage 2 follow-up, M12). A pack that does not
          # validate, or an empty match, fails the step.
          python -c "
          import sys
          from pathlib import Path
          import yaml
          from engine.config.schema import DomainSpec
          paths = sorted(Path('tests/fixtures/design_packs').glob('*/spec.yaml'))
          if not paths:
              sys.exit('no tests/fixtures/design_packs/*/spec.yaml found: the glob matches nothing')
          failures = []
          for path in paths:
              try:
                  DomainSpec.model_validate(yaml.safe_load(path.read_text()))
                  print(f'  {path}: OK')
              except Exception as e:
                  failures.append(str(path))
                  print(f'  FAIL {path}: {e}')
          if failures:
              sys.exit(f'{len(failures)} of {len(paths)} domain spec(s) do not validate: {failures}')
          print(f'Domain spec validation complete: {len(paths)} spec(s) OK')
          "
