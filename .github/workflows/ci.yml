# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: graph
# layer: [ci]
# tags: [L9_TEMPLATE, ci, pipeline]
# owner: platform
# status: active
# --- /L9_META ---
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Universal CI/CD Pack — Main CI Pipeline
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# VERSION: 1.0.0
# PURPOSE: Production-grade CI for any Python repository
# ZERO-CONFIG: Works immediately with sensible defaults
# CONFIGURABLE: Customize via Repository Variables (see env.template)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}
  COVERAGE_THRESHOLD: ${{ vars.COVERAGE_THRESHOLD || '60' }}
  TEST_DIR: ${{ vars.TEST_DIR || 'tests/' }}
  SOURCE_DIR: ${{ vars.SOURCE_DIR || '.' }}

jobs:
# ────────────────────────────────────────────────────────────────────────
# PHASE 1: VALIDATION
# ────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Validation Tools
        run: bash tools/deps/install_locked.sh tools

      - name: Check Python Syntax
        run: |
          echo "Checking Python syntax..."
          find . -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./__pycache__/*" \
            -not -path "./build/*" \
            -not -path "./dist/*" \
            -exec python -m py_compile {} +
          echo "✅ All Python files have valid syntax"

      - name: Check Deprecated API Usage
        run: |
          echo "Scanning for deprecated DomainSpecLoader usage..."
          python tools/check_deprecated_imports.py --check .
          echo "✅ No deprecated DomainSpecLoader usage found"

      - name: Gate_SDK declares the v1 channel (offline)
        run: |
          python scripts/validate_sdk_pin.py

      # The networked lock-vs-channel check lives in its own `sdk-channel` job
      # (below). `v1` moves inside Gate_SDK, so a stale lock is an upstream
      # event; kept here it failed `validate` and skipped every job that needs
      # it (lint, precommit, test, security, sbom). ci-gate still requires it.

      # PacketEnvelope prohibition is the packet-envelope-prohibited pre-commit
      # hook (tools/packet_envelope_gate.py), run by the `precommit` job below.
      # The l9-ci-sdk scanner performs a full-repository AST scan and compares
      # each finding fingerprint against the human-reviewed ledger at
      # .l9/baselines/packet-envelope.yml: new, increased, moved, expired, or
      # unowned PacketEnvelope debt blocks the PR. (The l9-ci-core Baseline
      # Ratchet caller was retired in #335; its reusable workflow no longer
      # exists in Core.) The legacy grep-based
      # tools/check_packet_envelope_prohibited.py was deleted.

      - name: Validate YAML Files
        run: |
          python3 -c "
          import yaml
          from pathlib import Path
          errors = []
          for f in Path('.github/workflows').glob('*.yml'):
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'❌ {e}')
              raise SystemExit(1)
          print('✅ All YAML workflow files are valid')
          "

# ────────────────────────────────────────────────────────────────────────
# PHASE 1b: GATE_SDK CHANNEL (networked, independent of validate)
# ────────────────────────────────────────────────────────────────────────
  sdk-channel:
    name: Gate_SDK Channel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Gate_SDK lock agrees with the v1 channel (networked)
        # The offline check in `validate` cannot see a stale lock: `v1` moves
        # inside Gate_SDK and nothing here changes. This resolves the channel at
        # the canonical remote and fails closed if uv.lock no longer matches.
        # No `needs`, and nothing needs it but ci-gate: a moved tag fails this
        # job and the gate, without starving test signal.
        run: |
          python scripts/validate_sdk_pin.py --verify-tag

      - name: Install uv (hash-locked)
        run: bash tools/deps/install_locked.sh uv

      - name: uv.lock agrees with pyproject.toml (networked)
        # `uv lock --check` resolves pyproject.toml with uv.lock as the
        # preference and fails when the result differs from the committed lock:
        # a dependency edited without `uv lock`. It never moves a locked
        # version, so a new PyPI release does not fail it. Networked (PyPI +
        # the Gate_SDK git source), hence here. Two failures are not a stale
        # lock: a PyPI/GitHub outage (re-run), and a pinned release yanked
        # upstream (a real signal: `uv lock --upgrade-package <name>`).
        env:
          UV_PYTHON_DOWNLOADS: never
        run: python -m uv lock --check

# ────────────────────────────────────────────────────────────────────────
# PHASE 2: LINT & TYPE CHECK
# ────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Linting Tools
        run: bash tools/deps/install_locked.sh ci

      - name: Run Ruff Linter
        run: |
          echo "Running Ruff linter..."
          ruff check . --output-format=github
          echo "✅ Ruff checks passed"

      - name: Run Ruff Formatter Check
        run: |
          echo "Checking code formatting..."
          ruff format --check .
          echo "✅ Code formatting is consistent"

      - name: Run Mypy Type Checker
        run: |
          echo "Running type checks..."
          # Scoped to engine/ (same invocation as `make lint` and
          # ci-quality.yml) -- mypy against the whole repo ('.') fails
          # immediately with "Source file found twice under different
          # module names" (tools/auditors/base.py vs auditors/base.py),
          # which is why this used to be silenced with `|| echo`. Fixed
          # scope + no more silencing: real type errors now fail the job.
          mypy engine/ --config-file=pyproject.toml --ignore-missing-imports --exclude chassis
          echo "✅ Mypy type checks passed"

# ────────────────────────────────────────────────────────────────────────
# PHASE 2.5: PRE-COMMIT HOOKS
# ────────────────────────────────────────────────────────────────────────
# Runs the exact hooks in .pre-commit-config.yaml so that every commit is
# checked here regardless of whether a contributor (human or agent) ran
# `pre-commit install` locally, or bypassed hooks with `git commit -n`.
# `pre-commit run --all-files` runs every hook and reports every failure
# in one pass (it does not stop at the first failing hook) -- so a single
# CI run surfaces the full list of violations to fix, not just one.
  precommit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Checkout pinned Odoo consumer
        uses: Quantum-L9/l9-ci-core/.github/actions/checkout-external@043f50ac41af17bf814f811076c5b48a640d9a2e
        with:
          token: ${{ secrets.L9_GITHUB_READ_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Runtime + Dev Dependencies
        # Needed for the "language: system" local hooks (pytest-unit,
        # deprecated-import checks, etc.) which shell out to the ambient
        # `python3` rather than an isolated pre-commit-managed env.
        run: bash tools/deps/install_locked.sh full

      - name: Run Pre-commit Hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # gitleaks: the pre-commit hook runs `gitleaks protect --staged`,
          # which inspects the git *index*, not the diff of a plain
          # checkout -- it does not translate to a CI context. Secret
          # scanning is already covered properly in the `security` job
          # below via gitleaks/gitleaks-action, which scans the actual
          # commit range.
          #
          # packet-envelope-prohibited (the local hook) now delegates to the
          # l9-ci-sdk baseline scanner + ledger comparison via
          # tools/packet_envelope_gate.py: the full repository is scanned
          # and every finding fingerprint must match an unexpired entry in
          # .l9/baselines/packet-envelope.yml. Known recorded debt is
          # tolerated; NEW violations block. No blanket skip is needed or
          # permitted (see docs/contracts/SHARED_MODELS.md and
          # TRANSPORT_PACKET_SPEC — PacketEnvelope is superseded by
          # TransportPacket).
          SKIP: gitleaks

# ────────────────────────────────────────────────────────────────────────
# PHASE 3: TEST SUITE
# ────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, lint]
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER || 'test_user' }}
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ${{ vars.POSTGRES_DB || 'test_db' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Service only runs if POSTGRES_ENABLED=true (GitHub ignores services with falsy conditions)

      # CEG-007: the redis service container is gone with the dependency. No
      # code under engine/ or chassis/ imports redis, so it started a container
      # every run for nothing.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Checkout pinned Odoo consumer
        uses: Quantum-L9/l9-ci-core/.github/actions/checkout-external@043f50ac41af17bf814f811076c5b48a640d9a2e
        with:
          token: ${{ secrets.L9_GITHUB_READ_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: bash tools/deps/install_locked.sh full

      - name: Run Tests with Coverage
        env:
          L9_ODOO_CONSUMER: ${{ github.workspace }}/odoo-consumer
          DATABASE_URL: postgresql://${{ vars.POSTGRES_USER || 'test_user' }}:test_password@localhost:5432/${{ vars.POSTGRES_DB || 'test_db' }}
        run: |
          echo "Running test suite..."
          # Performance benchmarks assert wall-clock throughput against a live
          # Neo4j. Under -n auto they share the runner with xdist workers and
          # the containerised Neo4j, so they measure contention, not the code;
          # they run in the serial Integration job against its Neo4j service.
          PYTHONPATH=. pytest ${{ env.TEST_DIR }} \
            -m "not performance" \
            -n auto \
            --cov=${{ env.SOURCE_DIR }} \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            --timeout=300 \
            --tb=short \
            -v
          echo "✅ All tests passed with coverage >=${{ env.COVERAGE_THRESHOLD }}%"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

# ────────────────────────────────────────────────────────────────────────
# PHASE 3.5: INTEGRATION TESTS (real Neo4j Enterprise + PostgreSQL)
# ────────────────────────────────────────────────────────────────────────
# The `test` job above has no Neo4j and does not install testcontainers, so
# every Neo4j-backed test in tests/integration skips there. This job runs
# tests/integration against real service containers instead:
#   - neo4j:5.18-enterprise — the per-domain database fixture issues
#     CREATE DATABASE, which Community Edition rejects. The Enterprise
#     evaluation licence is accepted for CI only (owner-approved 2026-10-29).
#     GDS is installed from the image's bundled products/ directory.
#   - postgres:16 — PACKET_STORE_TEST_DSN for PacketStore integration tests.
# CEG_REQUIRE_INTEGRATION=1 makes tests/conftest.py fail, not skip, when a
# service or dependency is missing, so this job cannot pass vacuously.
# Advisory: deliberately NOT in the ci-gate fan-in `needs:` list and not a
# required status check.
  integration:
    name: Integration Tests (Neo4j Enterprise + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, lint]
    permissions:
      contents: read

    services:
      neo4j:
        image: neo4j:5.18-enterprise@sha256:745cfda6713a7fa14f763d0730f464fd5b16afaccf5328ff9b4c5785c87b5f37
        env:
          NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
          NEO4J_AUTH: neo4j/l9-test-password
          NEO4J_PLUGINS: '["graph-data-science"]'
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p l9-test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s
      postgres:
        image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
        env:
          POSTGRES_USER: ceg_test
          POSTGRES_PASSWORD: ceg_test_password
          POSTGRES_DB: ceg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ceg_test -d ceg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout pinned Odoo consumer
        uses: Quantum-L9/l9-ci-core/.github/actions/checkout-external@043f50ac41af17bf814f811076c5b48a640d9a2e
        with:
          token: ${{ secrets.L9_GITHUB_READ_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: bash tools/deps/install_locked.sh full

      - name: Run Integration Tests
        env:
          L9_ODOO_CONSUMER: ${{ github.workspace }}/odoo-consumer
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: l9-test-password
          PACKET_STORE_TEST_DSN: postgresql://ceg_test:ceg_test_password@localhost:5432/ceg_test
          CEG_REQUIRE_INTEGRATION: '1'
        run: |
          PYTHONPATH=. pytest tests/integration tests/performance \
            -p no:xdist \
            --timeout=300 \
            --tb=short \
            -v

# ────────────────────────────────────────────────────────────────────────
# PHASE 4: SECURITY SCANNING
# ────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    permissions:
      contents: read
      security-events: write
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Security Tools
        run: bash tools/deps/install_locked.sh ci

      # gitleaks-action@v2 requires a paid org license (GITLEAKS_LICENSE).
      # The OSS CLI does not — keep secret detection fail-closed without the Action.
      - name: Install Gitleaks CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITLEAKS_VERSION=8.24.3
          gh release download "v${GITLEAKS_VERSION}" \
            --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --dir /tmp
          sudo tar xz -C /usr/local/bin -f "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          gitleaks version

      - name: Run Gitleaks (Secret Detection)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # Scan only commits introduced by this event — full-history scans
          # surface long-standing allowlisted-adjacent fixtures and block every PR.
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks detect --source . --log-opts "${PR_BASE}..${PR_HEAD}" \
              --config .gitleaks.toml --verbose --redact --exit-code 1
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            gitleaks detect --source . --log-opts "${PUSH_BEFORE}..${PUSH_SHA}" \
              --config .gitleaks.toml --verbose --redact --exit-code 1
          else
            gitleaks detect --source . --no-git \
              --config .gitleaks.toml --verbose --redact --exit-code 1
          fi

      - name: Run pip-audit (Dependency Vulnerabilities)
        run: |
          echo "Scanning dependencies for known vulnerabilities..."
          pip-audit --desc || echo "⚠️  Vulnerabilities found (non-blocking)"

      - name: Run Bandit (SAST)
        run: |
          echo "Running Bandit static security analysis..."
          bandit -r ${{ env.SOURCE_DIR }} \
            -ll \
            -f screen \
            --exclude ./venv,./.venv,./tests,./build,./dist \
            || echo "⚠️  Security warnings found (non-blocking)"

      - name: Check Dependency Graph Availability
        if: github.event_name == 'pull_request'
        id: depgraph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT=$(gh api "repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.sha }}" 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph unavailable; skipping Dependency Review in security job."
            echo "$OUT"
          fi

      - name: Dependency Review (PR only)
        if: github.event_name == 'pull_request' && steps.depgraph.outputs.available == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

# ────────────────────────────────────────────────────────────────────────
# PHASE 5: SBOM GENERATION
# ────────────────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Generate Software Bill of Materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

# ────────────────────────────────────────────────────────────────────────
# PHASE 6: OPENSSF SCORECARD
# ────────────────────────────────────────────────────────────────────────
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      # Private repository: scorecard-action documents these reads as needed
      # for the GitHub GraphQL calls (ListCommits etc.); without them the run
      # fails with "Resource not accessible by integration".
      issues: read
      pull-requests: read
      checks: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: scorecard.sarif

# ────────────────────────────────────────────────────────────────────────
# PHASE 7: CI GATE (Fan-In)
# ────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - validate
      - sdk-channel
      - lint
      - precommit
      - test
      - security
      - sbom
      - scorecard
    permissions:
      contents: read

    steps:
      - name: Evaluate All Results
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "CI Pipeline Results"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Job Results:"
          echo "  validate:   ${{ needs.validate.result }}"
          echo "  sdk-channel: ${{ needs.sdk-channel.result }}"
          echo "  lint:       ${{ needs.lint.result }}"
          echo "  precommit:  ${{ needs.precommit.result }}"
          echo "  test:       ${{ needs.test.result }}"
          echo "  security:   ${{ needs.security.result }}"
          echo "  sbom:       ${{ needs.sbom.result }}"
          echo "  scorecard:  ${{ needs.scorecard.result }}"
          echo ""

          # Check for failures in required jobs. sdk-channel has no `needs`,
          # so anything but success (failure, cancelled) fails closed.
          if [[ "${{ needs.validate.result }}" == "failure" ]] || \
             [[ "${{ needs.sdk-channel.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.precommit.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ CI GATE FAILED — Critical job(s) failed"
            echo ""
            echo "Required jobs must pass:"
            echo "  • validate: syntax and structure checks"
            echo "  • sdk-channel: uv.lock matches Gate_SDK@v1 and pyproject.toml"
            echo "  • lint: code quality and formatting"
            echo "  • precommit: same hooks contributors run locally"
            echo "  • test: test suite with coverage"
            exit 1
          fi

          echo "✅ CI GATE PASSED"
          echo "   All required checks completed successfully"
          echo "   Ready for code review and merge"
          echo ""

