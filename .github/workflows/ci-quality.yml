# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: graph
# layer: [ci]
# tags: [L9_TEMPLATE, ci, quality]
# owner: platform
# status: active
# --- /L9_META ---
# =============================================================================
# CI Quality Gates — Reusable Workflow (Repo-Agnostic)
#
# Drop into .github/workflows/ci-quality.yml of ANY Python project.
# All project-specific values come from repository variables/secrets.
#
# Required GitHub Secrets:
#   GITGUARDIAN_API_KEY  — GitGuardian API key
# Codecov upload is deferred. This workflow does not run pytest or upload coverage.
#
# Required GitHub Variables (Settings → Variables):
#   PYTHON_VERSION       — Python version (e.g. "3.12")
#
# Optional GitHub Variables:
#   TEST_DB_USER         — Test DB user (default: test)
#   TEST_DB_PASSWORD     — Test DB password (default: test)
#   TEST_DB_NAME         — Test DB name (default: test_db)
#   COVERAGE_THRESHOLD   — Min coverage % (default: 75)
#   SOURCE_DIRS          — Directories to scan (default: ".")
#   SEMGREP_RULES_PATH   — Path to custom semgrep rules (default: .semgrep/)
#
# Usage:
#   1. Copy this file to .github/workflows/ci-quality.yml
#   2. Set secrets and variables in GitHub repo settings
#   3. Add these job names to your existing ci-complete "needs:" list
# =============================================================================

name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.12' }}

jobs:

  # Ruff and mypy are not run here: l9-lint-test.yml owns them locally and
  # the required Analyze (central Core) job runs them again (`make check`).
  # ===========================================================================
  # SEMGREP — Custom Policy Rules
  # ===========================================================================
  semgrep:
    name: Semgrep Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Semgrep is Core-owned: its version is Quantum-L9/l9-ci-core
      # toolchain-lock.json's, installed hash-locked by Core's installer (on by
      # default). This repository names no Semgrep version, image or action.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Core toolchain (Semgrep included)
        id: core
        uses: Quantum-L9/l9-ci-core/.github/actions/install-consumer-ci@v2

      - name: Run Semgrep
        env:
          SEMGREP: ${{ steps.core.outputs.semgrep-executable }}
          RULES: ${{ vars.SEMGREP_RULES_PATH || '.semgrep/' }}
        run: |
          set -euo pipefail
          if [[ -z "${SEMGREP}" ]]; then
            echo "::error::install-consumer-ci@v2 did not install Semgrep (v2 predates Quantum-L9/l9-ci-core#248)"
            exit 1
          fi
          "${SEMGREP}" scan --config "${RULES}" --error --metrics=off --disable-version-check

      # The rule fixtures (.semgrep/fixtures/semgrep-rules.py: deliberate true
      # positives and true negatives) must keep matching, or a rule edit could
      # silently stop catching what it exists for. Same engine as the policy
      # scan above. The fixture path is given as a file: semgrep --test with a
      # directory target crashes, and a fixture under tests/ is hidden by the
      # rules' own **/tests/** exclude.
      - name: Semgrep rule fixtures (semgrep --test)
        env:
          SEMGREP: ${{ steps.core.outputs.semgrep-executable }}
        run: |
          "${SEMGREP}" --test --metrics=off --disable-version-check \
            --config .semgrep/semgrep-rules.yaml .semgrep/fixtures/semgrep-rules.py

  # ===========================================================================
  # SECRETS-SCAN — GitGuardian Secrets Detection
  # ===========================================================================
  secrets-scan:
    name: Secrets Scan (GitGuardian)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job conclusion is not the scan result. `native_outcome` is, and the
    # Quality Gate reads it: SCANNED_CLEAN, SECRET_DETECTED, KEY_ABSENT,
    # TOKEN_LACKS_SCOPE, CONTAINER_FAILED_TO_START or SCANNER_FAILED.
    outputs:
      native_outcome: ${{ steps.scan.outputs.outcome }}
      executed: ${{ steps.scan.outputs.executed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      # tools/scanner_outcomes.py runs the pinned image (same as ggshield-action,
      # no unlocked pip install), classifies what happened and exits.
      # Policy, unchanged: a detected secret or a scanner that started and
      # failed fails this job. A missing key, a token without the scan scope
      # and a container that could not start do not fail it; each is reported
      # as NOT EXECUTED and is never counted as a clean scan.
      # The container is given the runner's CI context by name (CI,
      # GITHUB_ACTIONS, GITHUB_SHA and the range variables below); without it
      # ggshield refuses `secret scan ci`.
      - name: GitGuardian scan
        id: scan
        env:
          GGSHIELD_IMAGE: gitguardian/ggshield:v1.53.0@sha256:387ad1467f110ce759a97dc4b25c978e7df58181f8e4793df55d40f89ce7142d
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: python3 tools/scanner_outcomes.py gitguardian-scan

  # Full pytest and Codecov moved to deep-plan.yml. This pull-request
  # workflow does not run a catalog and does not treat a missing coverage
  # job as a passing test result.

  # ===========================================================================
  # YAML-VALIDATE — YAML Linting
  # ===========================================================================
  yaml-validate:
    name: YAML Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # uv.lock targets Python 3.12 (pyproject requires-python); the runner's
      # system Python is not 3.12, so install_locked.sh needs this interpreter.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate YAML files
        # Fail-closed: no `|| true`, no continue-on-error. Severity policy
        # and per-file exclusions live in .yamllint.yml (errors block,
        # style-only issues are warnings).
        run: |
          bash tools/deps/install_locked.sh tools
          yamllint -c .yamllint.yml .

  # ===========================================================================
  # QUALITY-GATE — Aggregation job (add to your ci-complete "needs:")
  # ===========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - semgrep
      - secrets-scan
      - yaml-validate
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # A job conclusion of `success` is not proof that an outside service
      # ran. tools/scanner_outcomes.py fails the gate on any job that did not
      # succeed (as before) and reads the secrets job through its native
      # outcome: an advisory skip is listed as NOT EXECUTED, and `success`
      # without a clean native scan result is never counted as an executed
      # control. Hyphenated job ids need bracket syntax here; `needs.a-b`
      # parses as a subtraction and evaluates to an empty string.
      - name: Quality Gate Summary
        env:
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          SECRETS_SCAN_RESULT: ${{ needs['secrets-scan'].result }}
          SECRETS_SCAN_NATIVE: ${{ needs['secrets-scan'].outputs.native_outcome }}
          YAML_VALIDATE_RESULT: ${{ needs['yaml-validate'].result }}
        run: python3 tools/scanner_outcomes.py quality-gate
