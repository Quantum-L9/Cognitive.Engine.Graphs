name: Governance

permissions:
  contents: read

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issues:
    types: [opened, edited, reopened]

jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
