# L9 Governed Analysis Pipeline — Python Preset (LOCKED)
#
# Thin caller into Core analyze-semgrep.yml (SDK semgrep run → gate →
# publish + SARIF). Language is locked to python.

name: L9 Analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Immutable current Core pin. Keep this and the reusable-workflow `uses:`
  # revision identical so the caller cannot drift between human-visible and
  # executable authority.
  L9_CORE_REF: "ef138020013f077bcd14bc2e65a28f32a734400f"
permissions:
  contents: read
concurrency:
  group: l9-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (semgrep)
    uses: Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml@ef138020013f077bcd14bc2e65a28f32a734400f
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    with:
      profile: >-
        ${{ github.event_name == 'push' && 'merge'
         || github.event_name == 'workflow_dispatch' && 'nightly'
         || 'pr_fast' }}
      matrix-id: pr-semgrep
      language: python
