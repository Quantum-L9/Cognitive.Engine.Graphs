# DORA META: Dev Layer GMP (Gate-Measure-Prove) Validation
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CREATED: 2026-02-15T21:34:00-04:00
# AUTHOR: L9 Engineering (cryptoxdog)
# PURPOSE: Validate dev layer isolation and packet flow invariants
# DEPENDENCIES: pytest, dev_layer tests
# DEPLOYMENT: Runs on all PRs touching dev_layer/
# DORA METRICS: Gate pass rate >95% | Test coverage >80%
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

name: Dev Layer GMP Validation

on:
  pull_request:
    paths:
      - 'dev_layer/**'
      - 'tests/dev_layer/**'
  workflow_dispatch:

concurrency:
  group: dev-layer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dev-layer-validation:
    name: Validate Dev Layer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: bash tools/deps/install_locked.sh full

      - name: Run Dev Layer Tests
        run: |
          pytest tests/dev_layer/ \
            --cov=dev_layer \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      # Advisory, as before: a failed upload does not fail this job
      # (continue-on-error). What changed is that the failure is now visible.
      # With that input set to false the action reported success when
      # Codecov rejected the upload, so a rejected upload read as accepted.
      - name: Upload Coverage to Codecov
        id: codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: dev-layer
          fail_ci_if_error: true

      - name: Report Codecov upload outcome
        if: always()
        env:
          UPLOAD_STEP_OUTCOME: ${{ steps.codecov.outcome }}
        run: python3 tools/scanner_outcomes.py coverage-upload

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
