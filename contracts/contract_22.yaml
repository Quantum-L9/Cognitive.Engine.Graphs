id: CONTRACT-22
name: Scoring Weight Ceiling
layer: hardening
level: MUST
scope:
  paths:
  - engine/config/schema.py
  - engine/config/loader.py
  - domains/*/spec.yaml
preconditions:
- Scoring dimension added or its defaultweight modified in a domain spec
postconditions:
- Per match direction, the domain's default dimension weights sum to <= 1.0
- Enforced at spec load by DomainSpec cross-reference validation (domain_strict_validation)
- The engine declares no engine-wide scoring weights
docs:
- docs/contracts/SCORING_WEIGHT_CEILING.md
verification:
  scanner_rules: []
  test: tests/contracts/test_contracts.py::TestContract22ScoringWeightCeiling
