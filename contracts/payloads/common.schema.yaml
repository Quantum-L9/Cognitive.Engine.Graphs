$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:l9:plasticos:contracts:common:1.0.0-draft
title: CEG Common Payload Definitions
description: Shared $defs for payload-only contracts. Not a transport envelope.
  Domain-neutral — the domain id, match directions, entity types, outcome
  types and source systems a payload names are resolved against the
  authorized domain spec at admission (engine.models.payloads.DomainContract),
  not enumerated here.
x-publication-status: draft-unpublished
$defs:
  contract_version:
    type: string
    const: 1.0.0-draft
  domain:
    type: string
    description: Domain pack id (directory under the domains root). Admission requires it to equal the loaded domain.
    pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
  identifier:
    type: string
    description: A name the domain spec declares (match direction, entity type, outcome type, source system).
    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
  entity_ref:
    type: string
    pattern: ^[a-z0-9_.-]+:[^\s]+$
  revision:
    oneOf:
    - type: integer
      minimum: 0
    - type: string
      minLength: 1
  semver_ref:
    type: object
    additionalProperties: false
    required: [id, version]
    properties:
      id:
        type: string
        minLength: 1
      version:
        type: string
        minLength: 1
  source_ref:
    type: object
    additionalProperties: false
    required:
    - system
    - record_ref
    properties:
      system:
        $ref: urn:l9:plasticos:contracts:common:1.0.0-draft#/$defs/identifier
        description: Core systems (ceg, operator, external_source) plus the owners the domain's feature_catalog declares.
      record_ref:
        $ref: urn:l9:plasticos:contracts:common:1.0.0-draft#/$defs/entity_ref
      revision:
        $ref: urn:l9:plasticos:contracts:common:1.0.0-draft#/$defs/revision
  evidence_ref:
    $ref: urn:l9:plasticos:contracts:common:1.0.0-draft#/$defs/entity_ref
  field_value_state:
    type: string
    enum:
    - observed
    - reported
    - inferred
    - unknown
    - not_applicable
    - stale
    - conflicting
    - superseded
