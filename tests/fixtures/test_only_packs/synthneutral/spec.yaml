# --- L9_META ---
# l9_schema: 1
# origin: domain-specific
# engine: graph
# layer: [config]
# tags: [domains, synthneutral, test-only]
# owner: domain-team
# status: active
# --- /L9_META ---
# --- TEST_ONLY PACK (EIE-CEG-GATE-COLLAB-2026-11-21, lane PROOF) ---
# label:   TEST_ONLY — synthetic, domain-neutral tenant. Carries no PlasticOS
#          literal: no node, edge, property or code is shared with the
#          PlasticOS packs. It exercises the same spec constructs: a sync-managed candidate node with a
#          list<map> childsync keyed by edgeidentity, a taxonomy node, a
#          traversal hard gate with edge predicates (nullbehavior fail), a
#          threshold gate with nullbehavior pass, and one scoring dimension.
# purpose: P05 domain-neutrality witness. See TEST_ONLY.json for sha256.
# provenance: every synced non-identity property X is declared beside
#          X_provenance: enum[observed|enriched] (#351 revision, 2026-11-24).
# --- end TEST_ONLY header ---
domain:
  id: synthneutral
  name: Synthetic Neutral Witness
  version: 0.1.0
  description: TEST_ONLY synthetic tenant for domain-neutrality proof.
ontology:
  nodes:
  - label: Station
    managedby: sync
    candidate: true
    matchdirection: request_to_station
    properties:
    - {name: station_id, type: string, required: true}
    - {name: title, type: string, required: true}
    - {name: title_provenance, type: enum, values: [observed, enriched]}
    - {name: max_load, type: float}
    - {name: max_load_provenance, type: enum, values: [observed, enriched]}
    - {name: band, type: string}
    - {name: band_provenance, type: enum, values: [observed, enriched]}
    # F-A1-08 changed-fact witness: postal_code is the rule input, region the
    # rule output; both are declared identically by the EIE cartridge.
    - {name: postal_code, type: string}
    - {name: postal_code_provenance, type: enum, values: [observed, enriched]}
    - {name: region, type: string}
    - {name: region_provenance, type: enum, values: [observed, enriched]}
    - name: handled_kinds
      type: list
      items:
        type: map
        properties:
        - {name: code, type: string, required: true}
        - {name: slot_id, type: string}
        - {name: direction, type: string}
        - {name: direction_provenance, type: enum, values: [observed, enriched]}
  - label: Kind
    managedby: static
    taxonomy: true
    properties:
    - {name: code, type: string, required: true}
  - label: Request
    managedby: api
    queryentity: true
    matchdirection: request_to_station
    properties:
    - {name: request_id, type: string, required: true}
    - {name: kind_code, type: string}
    - {name: load, type: float}
  edges:
  - type: HANDLES
    from: Station
    to: Kind
    direction: DIRECTED
    category: capability
    managedby: sync
    properties:
    - {name: slot_id, type: string}
    - {name: direction, type: string}
    - {name: direction_provenance, type: enum, values: [observed, enriched]}
matchentities:
  candidate:
  - {label: Station, matchdirection: request_to_station}
  queryentity:
  - {label: Request, matchdirection: request_to_station}
queryschema:
  matchdirections: [request_to_station]
  fields:
  - {name: kind_code, type: string, required: true}
  - {name: load, type: float}
traversal:
  steps: []
gates:
- name: load_threshold
  type: threshold
  candidateprop: max_load
  queryparam: load
  operator: '>='
  nullbehavior: pass
  matchdirections: [request_to_station]
- name: kind_capability_gate
  type: traversal
  edgetype: HANDLES
  tonode: Kind
  candidateprop: code
  queryparam: kind_code
  nullbehavior: fail
  matchdirections: [request_to_station]
  edgepredicates:
  - {property: direction, equals: in}
scoring:
  dimensions:
  - name: load_headroom
    source: candidateproperty
    computation: lognormalized
    candidateprop: max_load
    maxvalue: 1000.0
    weightkey: w_load
    defaultweight: 0.5
    matchdirections: [request_to_station]
plugins:
  # The one registered rule (engine/inference_rule_registry.py) whose output
  # field (region) this tenant declares on both sides.
  inference_rules:
  - infer_geography_from_postal_code
sync:
  endpoints:
  - path: /v1/sync/stations
    targetnode: Station
    idproperty: station_id
    batchstrategy: UNWINDMERGE
    childsync:
    - field: handled_kinds
      targetnode: Kind
      targetid: code
      edgetype: HANDLES
      edgedirection: parenttochild
      edgeidentity: slot_id
      edgeproperties: [slot_id, direction, direction_provenance]
# --- TEST_ONLY overlay: capability grants for a staging-mode CEG ---
# CEG refuses writes in staging without an explicit grant (engine/handlers.py
# _enforce_capability). Grants are scoped to this tenant only; score:read is
# deliberately NOT granted (P36 stays conditional).
capabilities:
- {name: tenant_match_read, actions: ["match:read"], allowed_subjects: [synthneutral]}
- {name: tenant_sync_write, actions: ["sync:write"], allowed_subjects: [synthneutral]}
- {name: tenant_admin_write, actions: ["admin:write"], allowed_subjects: [synthneutral]}
