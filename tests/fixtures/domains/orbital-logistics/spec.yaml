# --- L9_META ---
# l9_schema: 1
# origin: engine-specific
# engine: graph
# layer: [test]
# tags: [test, fixtures, domain-neutrality, synthetic]
# owner: engine-team
# status: active
# --- /L9_META ---
#
# Synthetic verification domain for the CEG domain-neutrality acceptance tests.
# Deliberately unfamiliar vocabulary (no node, relationship, direction, outcome
# or source-system name shared with any shipped pack) so a test that passes
# here proves the engine executed the domain's declared contract rather than a
# built-in recipe. This is a verification input, not a canonical domain product.
domain:
  id: orbital-logistics
  name: Orbital Logistics (synthetic verification domain)
  version: 0.2.0
  description: Launch windows seeking orbital depots that can receive their payload.
ontology:
  nodes:
  - label: OrbitalDepot
    managedby: sync
    candidate: true
    matchdirection: window_to_depot
    properties:
    - name: depot_id
      type: string
      required: true
    - name: docking_ports
      type: int
    - name: reliability
      type: float
    - name: accepts_hazmat
      type: bool
    - name: lat
      type: float
    - name: lon
      type: float
    # Typed sync contract: a stored list<primitive>, a list<scalar> taxonomy
    # field (one SERVES_ORBIT edge per element) and a wire-only list<map>
    # consumed by childsync (one PropellantGrade + STOCKS edge per element).
    - name: certifications
      type: list
      items: {type: string}
    - name: served_orbits
      type: list
      items: {type: string}
    - name: stocked_grades
      type: list
      items:
        type: map
        properties:
        - {name: grade_code, type: string, required: true}
        - {name: purity, type: float}
  - label: LaunchWindow
    managedby: api
    queryentity: true
    matchdirection: window_to_depot
    properties:
    - name: window_id
      type: string
      required: true
    - name: payload_mass_kg
      type: float
  - label: PropellantGrade
    managedby: sync
    properties:
    - name: grade_code
      type: string
      required: true
    - name: purity
      type: float
  - label: OrbitClass
    managedby: static
    taxonomy: true
    properties:
    - name: class_code
      type: string
      required: true
    - name: altitude_km
      type: float
  edges:
  - type: STOCKS
    from: OrbitalDepot
    to: PropellantGrade
    direction: DIRECTED
    category: capability
    managedby: sync
  - type: SERVES_ORBIT
    from: OrbitalDepot
    to: OrbitClass
    direction: DIRECTED
    category: taxonomy
    managedby: sync
  - type: RESUPPLIED_BY
    from: OrbitalDepot
    to: OrbitalDepot
    direction: DIRECTED
    category: transaction
    managedby: sync
    properties:
    - name: outcome
      type: string
    - name: docked_at
      type: string
matchentities:
  candidate:
  - label: OrbitalDepot
    matchdirection: window_to_depot
  queryentity:
  - label: LaunchWindow
    matchdirection: window_to_depot
queryschema:
  matchdirections:
  - window_to_depot
  fields:
  - name: min_ports
    type: int
    required: false
    default: 1
traversal:
  steps: []
gates:
- name: hazmat_capable
  type: boolean
  candidateprop: accepts_hazmat
  nullbehavior: fail
- name: enough_ports
  type: threshold
  candidateprop: docking_ports
  queryparam: min_ports
  operator: '>='
  nullbehavior: fail
scoring:
  dimensions:
  - name: depot_reliability
    source: candidateproperty
    candidateprop: reliability
    computation: candidateproperty
    weightkey: w_reliability
    defaultweight: 0.6
  - name: port_capacity
    source: candidateproperty
    candidateprop: docking_ports
    computation: lognormalized
    weightkey: w_ports
    defaultweight: 0.3
sync:
  endpoints:
  - path: /v1/sync/orbital-depots
    method: POST
    targetnode: OrbitalDepot
    idproperty: depot_id
    batchstrategy: UNWINDMERGE
    taxonomyedges:
    - field: served_orbits
      edgetype: SERVES_ORBIT
      targetlabel: OrbitClass
      targetid: class_code
    childsync:
    - field: stocked_grades
      targetnode: PropellantGrade
      targetid: grade_code
      edgetype: STOCKS
      edgedirection: parenttochild
  - path: /v1/sync/propellant-grades
    method: POST
    targetnode: PropellantGrade
    idproperty: grade_code
    batchstrategy: UNWINDMERGE
  - path: /v1/sync/orbit-classes
    method: POST
    targetnode: OrbitClass
    idproperty: class_code
    batchstrategy: UNWINDMERGE
gdsjobs:
- name: depot_reinforcement
  algorithm: reinforcement
  schedule:
    type: manual
  projection:
    nodelabels: [OrbitalDepot]
    edgetypes: [RESUPPLIED_BY]
  sourceedge: RESUPPLIED_BY
  writeedge: TRUSTED_SUPPLIER
  writeproperties:
  - negative_writeedge: UNRELIABLE_SUPPLIER
    timestamp_property: docked_at
- name: depot_recency
  algorithm: temporalrecency
  schedule:
    type: manual
  projection:
    nodelabels: [OrbitalDepot]
    edgetypes: [RESUPPLIED_BY]
  sourceedge: RESUPPLIED_BY
  writeedge: RECENTLY_RESUPPLIED_BY
  writeproperties:
  - timestamp_property: docked_at
feature_catalog:
- feature_id: depot_reliability
  owner: station_ledger
  scoring_dimension: depot_reliability
  evidence_required: true
outcome_signals:
- signal: docked
  calibration_label: true
- signal: aborted
  calibration_label: false
