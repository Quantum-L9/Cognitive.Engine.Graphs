# SonarQube Cloud: CI-based analysis for Cognitive.Engine.Graphs.
#
# Automatic Analysis is off for this project (it cannot import coverage), so
# .github/workflows/sonar.yml runs the scanner on every pull request and on
# push to main.
sonar.organization=quantum-l9
sonar.projectKey=Quantum-L9_Cognitive.Engine.Graphs
sonar.projectName=Cognitive.Engine.Graphs
sonar.sources=.
sonar.tests=tests
sonar.python.version=3.12
# tests/ is the test root and must stay out of the source set. The rest are
# generated, vendored or documentation trees, not product source.
sonar.exclusions=tests/**,docs/**,odoo-consumer/**,artifacts/**,reports/**,**/.venv/**,**/__pycache__/**,.l9/runtime/**
# Cobertura report from the existing unit run (Core `make test`), when it is
# exported to this job. Until then the file is absent and Sonar reports no
# coverage rather than a measured value.
sonar.python.coverage.reportPaths=coverage-reports/coverage.xml
