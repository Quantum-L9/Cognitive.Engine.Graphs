# --- L9_META ---
# l9_schema: 1
# origin: engine-specific
# engine: graph
# layer: [security]
# tags: [semgrep, rules, consumer]
# owner: platform
# status: active
# --- /L9_META ---
#
# CEG-owned Semgrep rules that no central rule covers (CEG org-CI inventory,
# 2026-11-21). Declared in .l9/semgrep-consumer-rules.yaml, so Analyze (central
# Core) runs them as the required consumer instance (l9-ci-sdk ADR 0021); the
# local Semgrep Policy Check job (ci-quality.yml, --config .semgrep/) runs them
# too. Fixtures: .semgrep/fixtures/ceg-consumer-rules.py (semgrep --test).
rules:
- id: l9.httpx-async-context-required
  metadata:
    l9:
      canonical_rule_id: CONSUMER-COGNITIVE-ENGINE-GRAPHS-HTTPX-ASYNC-CONTEXT-REQUIRED
  patterns:
  - pattern: $CLIENT = httpx.AsyncClient(...)
  - pattern-not-inside: "async with httpx.AsyncClient(...) as $CLIENT:\n    ...\n"
  message: "httpx.AsyncClient() must use async context manager for proper cleanup.\n\
    \nBad:\n  client = httpx.AsyncClient()\n  await client.aclose()  # Easy to forget!\n\
    \nGood:\n  async with httpx.AsyncClient() as client:\n      ...  # Auto-closed\
    \ on exit\n"
  languages:
  - python
  severity: ERROR
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
- id: l9.singleton-requires-lock
  metadata:
    l9:
      canonical_rule_id: CONSUMER-COGNITIVE-ENGINE-GRAPHS-SINGLETON-REQUIRES-LOCK
  # Only real process-wide singletons: a module global rebound inside a
  # function (`global X`), or a class attribute on cls / a CapitalName.
  # A local or `self` lazy default is not shared state and needs no lock.
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: |
          def $F(...):
              ...
              global $X
              ...
      - pattern: |
          if $X is None:
              $X = $FACTORY(...)
    - pattern: |
        if cls.$ATTR is None:
            cls.$ATTR = $FACTORY(...)
    - patterns:
      - pattern: |
          if $CLS.$ATTR is None:
              $CLS.$ATTR = $FACTORY(...)
      - metavariable-regex:
          metavariable: $CLS
          regex: ^[A-Z][A-Za-z0-9_]*$
  - pattern-not-inside: |
      with $LOCK:
          ...
  message: "Singleton initialization must use a lock for thread safety.\n\nBad:\n\
    \  if _instance is None:\n      _instance = create_instance()\n\nGood:\n  if _instance\
    \ is None:\n      with _lock:\n          if _instance is None:  # Double-check\n\
    \              _instance = create_instance()\n"
  languages:
  - python
  severity: WARNING
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
- id: l9.float-requires-try-except
  metadata:
    l9:
      canonical_rule_id: CONSUMER-COGNITIVE-ENGINE-GRAPHS-FLOAT-REQUIRES-TRY-EXCEPT
  # Taint mode: flag float() only on values that flow from untrusted input
  # (request payloads, environment, argv, stdin, parsed JSON/YAML) and are not
  # converted inside a try block. A pattern of bare `float($VAR)` also matched
  # numpy/math results, arithmetic, literals and pydantic float fields, which
  # cannot raise ValueError: 55 false positives silenced by nosemgrep.
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: os.environ[...]
    - pattern: os.environ.get(...)
    - pattern: os.getenv(...)
    - pattern: sys.argv
    - pattern: input(...)
    - pattern: json.loads(...)
    - pattern: yaml.safe_load(...)
    - patterns:
      - pattern-either:
        - pattern-inside: |
            def $F(..., $P, ...):
                ...
        - pattern-inside: |
            async def $F(..., $P, ...):
                ...
      - metavariable-regex:
          metavariable: $P
          regex: ^(payload|body|raw|request|params|query|form|data)$
      - pattern: $P
  pattern-sanitizers:
  - pattern: int(...)
  pattern-sinks:
  - patterns:
    - pattern: float($VAR)
    - pattern-not-inside: |
        try:
            ...
        except ...:
            ...
    - pattern-not-inside: |
        try:
            ...
        except ...:
            ...
        else:
            ...
    - focus-metavariable: $VAR
  message: "float() of untrusted input should handle ValueError/TypeError.\n\nBad:\n\
    \  value = float(payload[\"x\"])  # Crashes on \"abc\"\n\nGood:\n  try:\n      value\
    \ = float(payload[\"x\"])\n  except (ValueError, TypeError):\n      value = default_value\n"
  languages:
  - python
  severity: WARNING
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
- id: l9.no-structlog-getchild
  metadata:
    l9:
      canonical_rule_id: CONSUMER-COGNITIVE-ENGINE-GRAPHS-NO-STRUCTLOG-GETCHILD
  # Only receivers bound to a structlog logger: stdlib
  # logging.getLogger(...).getChild() is valid and must not be flagged.
  patterns:
  - pattern-either:
    - pattern: structlog.get_logger(...).getChild(...)
    - pattern: structlog.getLogger(...).getChild(...)
    - pattern: structlog.get_logger(...).bind(...).getChild(...)
    - pattern: structlog.getLogger(...).bind(...).getChild(...)
    - patterns:
      - pattern-either:
        - pattern-inside: |
            $LOGGER = structlog.get_logger(...)
            ...
        - pattern-inside: |
            $LOGGER = structlog.getLogger(...)
            ...
        - pattern-inside: |
            $LOGGER = structlog.get_logger(...).bind(...)
            ...
        - pattern-inside: |
            $LOGGER = structlog.getLogger(...).bind(...)
            ...
      - pattern: $LOGGER.getChild(...)
  message: "structlog doesn't support getChild(). Use bind() instead.\n\nBad:\n  self.logger\
    \ = logger.getChild(self.__class__.__name__)\n\nGood:\n  self.logger = logger.bind(component=self.__class__.__name__)\n"
  languages:
  - python
  severity: ERROR
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
