# --- L9_META ---
# l9_schema: 1
# origin: l9-template
# engine: graph
# layer: [security]
# tags: [L9_TEMPLATE, semgrep, rules]
# owner: platform
# status: active
# --- /L9_META ---
rules:
- id: no-datetime-utcnow
  pattern: datetime.utcnow()
  message: "datetime.utcnow() is deprecated in Python 3.12+. Use datetime.now(UTC)\
    \ instead.\n\nFix:\n  from datetime import UTC, datetime\n  timestamp = datetime.now(UTC)\n"
  languages:
  - python
  severity: ERROR
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/scripts/**'
    - '**/venv/**'
    - '**/.venv/**'
- id: httpx-async-context-required
  patterns:
  - pattern: $CLIENT = httpx.AsyncClient(...)
  - pattern-not-inside: "async with httpx.AsyncClient(...) as $CLIENT:\n    ...\n"
  message: "httpx.AsyncClient() must use async context manager for proper cleanup.\n\
    \nBad:\n  client = httpx.AsyncClient()\n  await client.aclose()  # Easy to forget!\n\
    \nGood:\n  async with httpx.AsyncClient() as client:\n      ...  # Auto-closed\
    \ on exit\n"
  languages:
  - python
  severity: ERROR
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
- id: singleton-requires-lock
  # Only real process-wide singletons: a module global rebound inside a
  # function (`global X`), or a class attribute on cls / a CapitalName.
  # A local or `self` lazy default is not shared state and needs no lock.
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: |
          def $F(...):
              ...
              global $X
              ...
      - pattern: |
          if $X is None:
              $X = $FACTORY(...)
    - pattern: |
        if cls.$ATTR is None:
            cls.$ATTR = $FACTORY(...)
    - patterns:
      - pattern: |
          if $CLS.$ATTR is None:
              $CLS.$ATTR = $FACTORY(...)
      - metavariable-regex:
          metavariable: $CLS
          regex: ^[A-Z][A-Za-z0-9_]*$
  - pattern-not-inside: |
      with $LOCK:
          ...
  message: "Singleton initialization must use a lock for thread safety.\n\nBad:\n\
    \  if _instance is None:\n      _instance = create_instance()\n\nGood:\n  if _instance\
    \ is None:\n      with _lock:\n          if _instance is None:  # Double-check\n\
    \              _instance = create_instance()\n"
  languages:
  - python
  severity: WARNING
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
- id: float-requires-try-except
  # Taint mode: flag float() only on values that flow from untrusted input
  # (request payloads, environment, argv, stdin, parsed JSON/YAML) and are not
  # converted inside a try block. A pattern of bare `float($VAR)` also matched
  # numpy/math results, arithmetic, literals and pydantic float fields, which
  # cannot raise ValueError: 55 false positives silenced by nosemgrep.
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: os.environ[...]
    - pattern: os.environ.get(...)
    - pattern: os.getenv(...)
    - pattern: sys.argv
    - pattern: input(...)
    - pattern: json.loads(...)
    - pattern: yaml.safe_load(...)
    - patterns:
      - pattern-either:
        - pattern-inside: |
            def $F(..., $P, ...):
                ...
        - pattern-inside: |
            async def $F(..., $P, ...):
                ...
      - metavariable-regex:
          metavariable: $P
          regex: ^(payload|body|raw|request|params|query|form|data)$
      - pattern: $P
  pattern-sanitizers:
  - pattern: int(...)
  pattern-sinks:
  - patterns:
    - pattern: float($VAR)
    - pattern-not-inside: |
        try:
            ...
        except ...:
            ...
    - pattern-not-inside: |
        try:
            ...
        except ...:
            ...
        else:
            ...
    - focus-metavariable: $VAR
  message: "float() of untrusted input should handle ValueError/TypeError.\n\nBad:\n\
    \  value = float(payload[\"x\"])  # Crashes on \"abc\"\n\nGood:\n  try:\n      value\
    \ = float(payload[\"x\"])\n  except (ValueError, TypeError):\n      value = default_value\n"
  languages:
  - python
  severity: WARNING
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
- id: no-eval
  patterns:
  - pattern: eval(...)
  - pattern-not: $OBJ.eval(...)
  message: "eval() is forbidden \u2014 security vulnerability.\n\nUse safe alternatives:\n\
    \  - json.loads() for JSON\n  - ast.literal_eval() for Python literals\n  - Custom\
    \ parser for DSL\n"
  languages:
  - python
  severity: ERROR
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/scripts/**'
    - '**/venv/**'
- id: no-sql-fstring
  patterns:
  - pattern-either:
    - pattern: f"SELECT ... {$VAR} ..."
    - pattern: f"INSERT ... {$VAR} ..."
    - pattern: f"UPDATE ... {$VAR} ..."
    - pattern: f"DELETE ... {$VAR} ..."
  message: "SQL queries must use parameterized queries, not f-strings.\n\nBad:\n \
    \ query = f\"SELECT * FROM users WHERE id = '{user_id}'\"\n\nGood:\n  query =\
    \ \"SELECT * FROM users WHERE id = $1\"\n  await conn.fetch(query, user_id)\n"
  languages:
  - python
  severity: ERROR
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
- id: no-pickle-loads
  pattern: pickle.loads(...)
  message: "pickle.loads() is forbidden \u2014 deserialization vulnerability.\n\n\
    Use safe alternatives:\n  - json.loads() for JSON data\n  - msgpack for binary\
    \ data\n  - Protocol Buffers for structured data\n"
  languages:
  - python
  severity: ERROR
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
- id: no-structlog-getchild
  pattern: $LOGGER.getChild(...)
  message: "structlog doesn't support getChild(). Use bind() instead.\n\nBad:\n  self.logger\
    \ = logger.getChild(self.__class__.__name__)\n\nGood:\n  self.logger = logger.bind(component=self.__class__.__name__)\n"
  languages:
  - python
  severity: ERROR
  paths:
    include:
    - '**/*.py'
    exclude:
    - '**/tests/**'
    - '**/venv/**'
